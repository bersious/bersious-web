<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project · bersious</title>
  <meta name="description" content="Project details — bersious" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2360a5fa'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, Inter, sans-serif' font-size='42' font-weight='800' fill='%230b0d12'%3EN%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d12;
      --surface: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --blue: #60a5fa;
      --pink: #ec4899;
      --blue-glow: rgba(96, 165, 250, 0.22);
      --pink-glow: rgba(236, 72, 153, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Background gradient blobs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      background: var(--blue-glow);
      top: -200px;
      left: -200px;
      width: 640px;
      height: 640px;
      opacity: 0.55;
    }

    body::after {
      background: var(--pink-glow);
      bottom: -200px;
      right: -200px;
      width: 460px;
      height: 460px;
      opacity: 0.4;
      filter: blur(140px);
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    nav {
      padding: 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      color: var(--text-main);
      text-decoration: none;
    }

    .back-link {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--blue);
    }

    main {
      padding: 80px 0 120px;
    }

    .project-header {
      margin-bottom: 60px;
    }

    .project-slug {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--blue);
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .project-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .project-empty {
      color: var(--text-sub);
      font-size: 1.05rem;
      padding: 60px 32px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      text-align: center;
      background: var(--surface);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">bersious.</a>
      <a href="index.html" class="back-link">← back</a>
    </nav>

    <main>
      <div class="project-header">
        <div class="project-slug" id="project-slug">project</div>
        <h1 class="project-title" id="project-title">Untitled</h1>
      </div>

      <div class="project-empty">
        🚧 This page is empty for now. Content coming soon.
      </div>
    </main>
  </div>

  <script>
    // Read slug from URL
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug') || 'project';

    // Map slug to display name
    const projectNames = {
      'bersious-web': 'bersious.io.vn',
      'tmn-2010': 'TMN 20/10',
      'project-03': 'Project 03'
    };

    document.getElementById('project-slug').textContent = '/' + slug;
    document.getElementById('project-title').textContent = projectNames[slug] || slug;
    document.title = (projectNames[slug] || slug) + ' · bersious';
  </script>
</body>
</html>
