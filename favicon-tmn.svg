<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#a8d8b9"/>
  <!-- Water surface -->
  <rect x="4" y="46" width="56" height="10" fill="#7ab893" rx="2"/>
  <!-- Yellow reflections on water -->
  <line x1="8" y1="50" x2="14" y2="50" stroke="#d4eb78" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="52" x2="26" y2="52" stroke="#d4eb78" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="50" x2="50" y2="50" stroke="#d4eb78" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Duck body shadow on water -->
  <ellipse cx="32" cy="46" rx="16" ry="3" fill="#5a8a73" opacity="0.6"/>
  <!-- Small ripples -->
  <path d="M 12 44 Q 14 42 16 44" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 48 44 Q 50 42 52 44" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Duck body -->
  <circle cx="32" cy="30" r="18" fill="#ffffff"/>
  <ellipse cx="32" cy="44" rx="16" ry="3" fill="#e8e8e8"/>
  <!-- Beak -->
  <line x1="38" y1="28" x2="48" y2="28" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="32" x2="48" y2="32" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth shadow -->
  <line x1="38" y1="36" x2="42" y2="36" stroke="#808080" stroke-width="1" stroke-linecap="round"/>
</svg>
