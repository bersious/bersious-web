<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>🔒 bersious • visitor stats</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #14141a;
    --border: #2a2a35;
    --text: #e8e8ee;
    --muted: #8a8a98;
    --accent: #60a5fa;
    --pink: #ec4899;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
    line-height: 1.5;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 24px; font-weight: 600; }
  h1 .lock { color: var(--accent); }
  .top-bar { display: flex; gap: 8px; align-items: center; }
  input, button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; transition: all 0.15s; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  .gate {
    display: flex;
    gap: 8px;
    max-width: 400px;
    margin: 80px auto;
  }
  .gate input { flex: 1; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .stat .label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .stat .value {
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
  }
  .stat.accent .value { color: var(--accent); }
  .stat.pink .value { color: var(--pink); }
  .stat.green .value { color: var(--green); }
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .section h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 500; }
  .bar {
    background: var(--border);
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--pink));
  }
  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }
  .table th, .table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .table th {
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .table tr:hover td { background: rgba(96, 165, 250, 0.04); }
  .ip-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .ts { color: var(--muted); font-size: 12px; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters input { flex: 1; min-width: 200px; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    background: rgba(96, 165, 250, 0.1);
    color: var(--accent);
  }
  .pill.pink { background: rgba(236, 72, 153, 0.1); color: var(--pink); }
  .pill.green { background: rgba(34, 197, 94, 0.1); color: var(--green); }
  .pill.muted { background: rgba(138, 138, 152, 0.1); color: var(--muted); }
  .status { color: var(--muted); font-size: 12px; }
  .status.error { color: var(--red); }
  .status.ok { color: var(--green); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="lock">🔒</span> visitor stats</h1>
    <div class="top-bar">
      <button id="refresh">↻ refresh</button>
      <button id="clear" class="danger">clear log</button>
      <button id="logout">logout</button>
    </div>
  </header>

  <!-- Login gate -->
  <div id="gate" class="gate">
    <input id="key" type="password" placeholder="nhập STATS_KEY" autofocus>
    <button id="login">mở</button>
  </div>

  <!-- Dashboard (hidden until authed) -->
  <div id="dash" style="display:none;">
    <div class="status" id="status">đang tải…</div>

    <div class="stats-grid" id="stats-grid"></div>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; margin-bottom: 16px;">
      <div class="section">
        <h2>🌍 theo quốc gia</h2>
        <div id="by-country"></div>
      </div>
      <div class="section">
        <h2>📱 thiết bị</h2>
        <div id="by-device"></div>
      </div>
      <div class="section">
        <h2>🌐 trình duyệt</h2>
        <div id="by-browser"></div>
      </div>
      <div class="section">
        <h2>📄 trang hay vào</h2>
        <div id="by-path"></div>
      </div>
    </div>

    <div class="section">
      <h2>👥 top IP (nhiều lượt nhất)</h2>
      <div id="top-ips"></div>
    </div>

    <div class="section">
      <h2>📋 lịch sử truy cập</h2>
      <div class="filters">
        <input id="search" placeholder="lọc theo IP, country, path…">
      </div>
      <div id="entries"></div>
    </div>
  </div>
</div>

<script>
const SESSION_KEY = 'bersious_stats_key';
let ALL_ENTRIES = [];
let LAST_RESULT = null;

const $ = (id) => document.getElementById(id);
const fmtTime = (ts) => {
  const d = new Date(ts);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
};
const ago = (ts) => {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return `${s}s trước`;
  if (s < 3600) return `${Math.floor(s/60)}m trước`;
  if (s < 86400) return `${Math.floor(s/3600)}h trước`;
  return `${Math.floor(s/86400)}d trước`;
};

function showDash() {
  $('gate').style.display = 'none';
  $('dash').style.display = 'block';
}
function showGate() {
  $('gate').style.display = 'flex';
  $('dash').style.display = 'none';
}

function renderCounts(d) {
  $('stats-grid').innerHTML = `
    <div class="stat accent"><div class="label">Tổng lượt</div><div class="value">${d.total}</div></div>
    <div class="stat pink"><div class="label">IP duy nhất</div><div class="value">${d.uniqueIPs}</div></div>
    <div class="stat green"><div class="label">Quốc gia</div><div class="value">${Object.keys(d.byCountry).length}</div></div>
    <div class="stat"><div class="label">Trình duyệt</div><div class="value">${Object.keys(d.byBrowser).length}</div></div>
  `;
}

function renderRows(elId, obj, fmt = (k) => k) {
  const total = Object.values(obj).reduce((a, b) => a + b, 0) || 1;
  const sorted = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  if (sorted.length === 0) {
    $(elId).innerHTML = '<div class="empty">chưa có dữ liệu</div>';
    return;
  }
  $(elId).innerHTML = sorted.map(([k, v]) => {
    const pct = (v / total) * 100;
    return `<div class="row">
      <div style="flex:1;">
        <div style="display:flex; justify-content:space-between;">
          <span class="k">${fmt(k) || '—'}</span>
          <span class="v">${v}</span>
        </div>
        <div class="bar"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

function renderTopIPs(d) {
  if (d.topIPs.length === 0) {
    $('top-ips').innerHTML = '<div class="empty">chưa có dữ liệu</div>';
    return;
  }
  $('top-ips').innerHTML = `
    <table class="table">
      <thead><tr><th>IP</th><th>Vị trí</th><th>Lượt</th><th>Lần cuối</th></tr></thead>
      <tbody>
      ${d.topIPs.map(x => `<tr>
        <td class="ip-mono">${x.ip}</td>
        <td>${[x.city, x.country].filter(Boolean).join(', ') || '—'}</td>
        <td>${x.count}</td>
        <td class="ts">${ago(x.lastTs)}</td>
      </tr>`).join('')}
      </tbody>
    </table>
  `;
}

function renderEntries(filter = '') {
  const f = filter.toLowerCase().trim();
  const filtered = f
    ? ALL_ENTRIES.filter(e =>
        (e.ip || '').includes(f) ||
        (e.country || '').toLowerCase().includes(f) ||
        (e.city || '').toLowerCase().includes(f) ||
        (e.path || '').toLowerCase().includes(f) ||
        (e.browser || '').toLowerCase().includes(f) ||
        (e.os || '').toLowerCase().includes(f))
    : ALL_ENTRIES;

  if (filtered.length === 0) {
    $('entries').innerHTML = '<div class="empty">không có dữ liệu khớp</div>';
    return;
  }

  // Cap to first 500 for perf
  const slice = filtered.slice(0, 500);
  $('entries').innerHTML = `
    <table class="table">
      <thead><tr><th>Thời gian</th><th>IP</th><th>Vị trí</th><th>Thiết bị</th><th>Trình duyệt</th><th>Trang</th></tr></thead>
      <tbody>
      ${slice.map(e => {
        const devicePill = e.device === 'bot' ? 'muted' : (e.device === 'mobile' ? 'pink' : (e.device === 'desktop' ? 'green' : ''));
        return `<tr>
          <td class="ts" title="${fmtTime(e.ts)}">${ago(e.ts)}</td>
          <td class="ip-mono">${e.ip}</td>
          <td>${[e.city, e.country].filter(Boolean).join(', ') || '<span class="pill muted">—</span>'}</td>
          <td><span class="pill ${devicePill}">${e.device}</span> <span class="ts">${e.os || ''}</span></td>
          <td>${e.browser || '—'}</td>
          <td class="ip-mono">${e.path || '/'}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
    ${filtered.length > 500 ? `<div class="empty" style="padding: 16px 0;">hiển thị 500/${filtered.length} — lọc để thu hẹp</div>` : ''}
  `;
}

async function load() {
  const key = sessionStorage.getItem(SESSION_KEY);
  if (!key) return;
  $('status').className = 'status';
  $('status').textContent = 'đang tải…';
  try {
    const res = await fetch(`/api/visitors?key=${encodeURIComponent(key)}&limit=2000`);
    if (res.status === 401) {
      sessionStorage.removeItem(SESSION_KEY);
      showGate();
      $('status').textContent = 'sai key';
      $('status').className = 'status error';
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    LAST_RESULT = await res.json();
    ALL_ENTRIES = LAST_RESULT.entries;
    renderCounts(LAST_RESULT);
    renderRows('by-country', LAST_RESULT.byCountry);
    renderRows('by-device', LAST_RESULT.byDevice);
    renderRows('by-browser', LAST_RESULT.byBrowser);
    renderRows('by-path', LAST_RESULT.byPath);
    renderTopIPs(LAST_RESULT);
    renderEntries($('search').value);
    $('status').textContent = `cập nhật lúc ${fmtTime(Date.now())}`;
    $('status').className = 'status ok';
    showDash();
  } catch (e) {
    $('status').textContent = `lỗi: ${e.message}`;
    $('status').className = 'status error';
  }
}

$('login').addEventListener('click', () => {
  const v = $('key').value.trim();
  if (!v) return;
  sessionStorage.setItem(SESSION_KEY, v);
  load();
});
$('key').addEventListener('keypress', (e) => { if (e.key === 'Enter') $('login').click(); });
$('refresh').addEventListener('click', load);
$('logout').addEventListener('click', () => {
  sessionStorage.removeItem(SESSION_KEY);
  $('key').value = '';
  showGate();
});
$('clear').addEventListener('click', async () => {
  if (!confirm('Xóa toàn bộ log?')) return;
  const key = sessionStorage.getItem(SESSION_KEY);
  await fetch(`/api/visitors?key=${encodeURIComponent(key)}`, { method: 'DELETE' });
  load();
});
$('search').addEventListener('input', (e) => renderEntries(e.target.value));

// Auto-refresh every 30s
setInterval(() => {
  if (sessionStorage.getItem(SESSION_KEY)) load();
}, 30000);

if (sessionStorage.getItem(SESSION_KEY)) load();
</script>
</body>
</html>
