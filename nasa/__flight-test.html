<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flight test</title>
<link rel="stylesheet" href="./css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07090d; }
  #host { position: absolute; inset: 0; }
</style>
<script>
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push('error: ' + (e.message || e)));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));
  const origError = console.error.bind(console);
  console.error = function (...a) { window.__errors.push('console.error: ' + a.map(String).join(' ')); origError(...a); };
  const origWarn = console.warn.bind(console);
  console.warn = function (...a) { window.__errors.push('console.warn: ' + a.map(String).join(' ')); origWarn(...a); };
</script>
</head>
<body>
<div id="host"></div>
<script type="module">
import { startFlight } from './flight.js';

const num = (s) => parseFloat(String(s).trim().replace(/\./g, '').replace(',', '.'));

const log = { opens: [], answers: [], t0: performance.now(), done: null };
const handle = startFlight({
  container: document.getElementById('host'),
  design: { name: 'Test Run Ares' },
  onDone: (payload) => {
    log.done = {
      elapsedDays: payload.elapsedDays,
      success: payload.success,
      cohesion: payload.negotiationState.cohesion,
      turns: payload.negotiationState.turn,
      atMs: performance.now() - log.t0,
    };
  },
});

let prevOpen = false;
let prevFail = false;
let prevArrive = false;

function snapshot() {
  const ev = document.querySelector('.flt-event');
  const main = document.querySelector('.flt-bar.is-main');
  const roles = {};
  document.querySelectorAll('.flt-bars-roles .flt-bar').forEach((b) => {
    roles[b.dataset.role] = {
      trust: num(b.querySelector('.flt-bar-val').textContent),
      status: b.dataset.status,
      fill: b.querySelector('.flt-bar-fill').style.getPropertyValue('--fill'),
    };
  });
  return {
    day: num(document.querySelector('.flt-t-day').textContent),
    au: document.querySelector('.flt-t-au').textContent,
    km: document.querySelector('.flt-t-km').textContent,
    delay: document.querySelector('.flt-t-delay').textContent,
    tcm: document.querySelector('.flt-t-tcm').textContent,
    phaseName: document.querySelector('.flt-phase-name').textContent,
    teleDayOf: document.querySelector('.flt-u-of').textContent + ' ' + document.querySelector('.flt-phase-day').textContent,
    eventOpen: ev ? !ev.hidden : false,
    eventTitle: ev && !ev.hidden ? ev.querySelector('.flt-ev-title').textContent : '',
    options: ev ? Array.from(ev.querySelectorAll('.flt-opt')).map((b) => ({
      id: b.dataset.option,
      label: b.querySelector('.flt-opt-label').textContent,
      disabled: b.disabled,
    })) : [],
    cohesion: num(main.querySelector('.flt-bar-val').textContent),
    cohesionStatus: main.dataset.status,
    cohesionLabel: main.querySelector('.flt-bar-status').textContent,
    barFill: main.querySelector('.flt-bar-fill').style.getPropertyValue('--fill'),
    roles,
    failShown: !document.querySelector('.flt-fail').hidden,
    arriveShown: !document.querySelector('.flt-arrive').hidden,
    optionCount: document.querySelectorAll('.flt-opt').length,
    canvasPainted: (() => {
      const c = document.querySelector('.mviz-canvas');
      if (!c) return { found: false };
      const ctx = c.getContext('2d');
      const d = ctx.getImageData(0, 0, Math.min(c.width, 400), Math.min(c.height, 400)).data;
      let nonBlack = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] + d[i + 1] + d[i + 2] > 40) nonBlack += 1;
      }
      return { found: true, w: c.width, h: c.height, nonBlack, ratio: nonBlack / (d.length / 4) };
    })(),
    barRects: (() => {
      const r = {};
      document.querySelectorAll('.flt-btn, .flt-opt, .flt-speed, .flt-info').forEach((b, i) => {
        const rect = b.getBoundingClientRect();
        if (rect.width > 0) r[(b.className || '') + i] = Math.round(rect.height);
      });
      return r;
    })(),
    mapH: Math.round(document.querySelector('.flt-map').getBoundingClientRect().height),
    sideH: Math.round(document.querySelector('.flt-side').getBoundingClientRect().height),
    viewport: { w: innerWidth, h: innerHeight },
    sideScrollable: (() => {
      const b = document.querySelector('.flt-body');
      return { scrollHeight: b.scrollHeight, clientHeight: b.clientHeight, overflowY: getComputedStyle(b).overflowY };
    })(),
  };
}

const poll = setInterval(() => {
  const ev = document.querySelector('.flt-event');
  const open = ev ? !ev.hidden : false;
  if (open && !prevOpen) {
    log.opens.push({
      atMs: Math.round(performance.now() - log.t0),
      day: num(document.querySelector('.flt-t-day').textContent),
      phase: document.querySelector('.flt-phase-name').textContent,
      title: ev.querySelector('.flt-ev-title').textContent,
      options: ev.querySelectorAll('.flt-opt').length,
    });
  }
  prevOpen = open;
  const fail = !document.querySelector('.flt-fail').hidden;
  if (fail && !prevFail) log.failAt = { day: num(document.querySelector('.flt-t-day').textContent), atMs: Math.round(performance.now() - log.t0) };
  prevFail = fail;
  const arrive = !document.querySelector('.flt-arrive').hidden;
  if (arrive && !prevArrive) log.arriveAt = { day: num(document.querySelector('.flt-t-day').textContent), atMs: Math.round(performance.now() - log.t0) };
  prevArrive = arrive;
}, 20);

let auto = null;

window.__t = {
  handle,
  log,
  snap: snapshot,
  speed(n) { document.querySelector(`.flt-speed[data-speed="${n}"]`).click(); return snapshot(); },
  clickOption(i) {
    const btns = document.querySelectorAll('.flt-opt:not([disabled])');
    if (!btns[i]) return null;
    const id = btns[i].dataset.option;
    btns[i].click();
    log.answers.push({ day: num(document.querySelector('.flt-t-day').textContent), id });
    return id;
  },
  clickContinue() {
    const b = document.querySelector('.flt-continue');
    if (b.hidden) return false;
    b.click();
    return true;
  },
  /* strategy: 'first' | 'last' | 'worst' | 'best' */
  startAuto(strategy, delayMs = 40) {
    auto = setInterval(() => {
      if (document.querySelector('.flt-arrive') && !document.querySelector('.flt-arrive').hidden) return;
      if (document.querySelector('.flt-fail') && !document.querySelector('.flt-fail').hidden) return;
      const ev = document.querySelector('.flt-event');
      if (!ev || ev.hidden) return;
      const btns = Array.from(document.querySelectorAll('.flt-opt'));
      if (!btns.length) return;
      if (btns[0].disabled) {
        document.querySelector('.flt-continue').click();
        return;
      }
      let idx = 0;
      if (strategy === 'last') idx = btns.length - 1;
      if (strategy === 'worst' || strategy === 'best') {
        /* chỉ chấm điểm theo đúng chip đồng thuận, không cộng lẫn tài
           nguyên: một phương án tiết kiệm điện nhiều vẫn có thể phá đội */
        const key = strategy === 'worst' ? 'min' : 'max';
        let best = null;
        btns.forEach((b, i) => {
          const chips = Array.from(b.querySelectorAll('.flt-chip'));
          const coh = chips.find((c) => /đồng thuận|cohesion/.test(c.textContent));
          const score = coh ? (num(coh.textContent.replace(/[^0-9,.-]/g, '')) || 0) : 0;
          if (!best || (key === 'max' ? score > best.score : score < best.score)) best = { i, score };
        });
        idx = best ? best.i : 0;
      }
      window.__t.clickOption(idx);
    }, delayMs);
  },
  stopAuto() { clearInterval(auto); auto = null; },
  stopPoll() { clearInterval(poll); },
  errors: () => window.__errors,
  failRetry() {
    document.querySelector('.flt-fail-retry').click();
    return snapshot();
  },
  info() {
    document.querySelector('.flt-info').click();
    const m = document.querySelector('.flt-modal');
    return { open: !m.hidden, title: m.querySelector('.flt-card-title').textContent, secs: Array.from(m.querySelectorAll('.flt-info-p')).map((p) => p.textContent.length) };
  },
  closeInfo() { document.querySelector('.flt-info-close').click(); return document.querySelector('.flt-modal').hidden; },
  arriveOk() { document.querySelector('.flt-arrive-ok').click(); },
};
window.__ready = true;
</script>
</body>
</html>
