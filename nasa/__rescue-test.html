<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rescue designer test</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  html,body{margin:0;height:100%;background:#07090d;font-family:system-ui}
  #stage{position:relative;height:100vh}
</style>
</head>
<body>
<div id="stage"></div>
<div id="log" hidden></div>
<script type="module">
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push('rej: ' + String(e.reason)));
  const origErr = console.error;
  console.error = (...a) => { window.__errors.push(a.map(String).join(' ')); origErr(...a); };
  const mod = await import('./rescue-designer.js');
  window.__api = mod.startRescueDesigner({
    container: document.getElementById('stage'),
    onDone: (d) => { window.__done = d; },
  });
  window.__ready = true;
</script>
</body>
</html>
