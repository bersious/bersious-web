<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Mission Design Game · NASA Space Apps 2026</title>
<meta name="description" content="Thiết kế một sứ mệnh không gian và hiểu ra cái giá của từng quyết định.">
<meta name="theme-color" content="#07090d">
<!-- Favicon nhúng thẳng dạng data-URI. Bản cũ trỏ tới
     /assets/nasa-logo-96.png nhưng tệp đó không có trong repo, nên mỗi
     lần tải trang là một 404 và khi deploy lên /nasa thì đường dẫn
     tuyệt đối đó còn sai chỗ hơn. Nhúng thẳng thì không bao giờ 404 và
     không phụ thuộc thư mục gốc. Hình: tên lửa nhỏ trên nền tối. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2307090d'/%3E%3Cpath d='M32 10c6 5 9 13 9 22v8l-5 4h-8l-5-4v-8c0-9 3-17 9-22z' fill='%23e8b04b'/%3E%3Ccircle cx='32' cy='26' r='4' fill='%2307090d'/%3E%3Cpath d='M23 40l-5 8 8-3M41 40l5 8-8-3' fill='%23c8552d'/%3E%3Cpath d='M29 46h6l-3 9z' fill='%23ff7a2f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font nạp KHÔNG chặn vẽ. media="print" + onload đổi sang "all" là
     mẹo chuẩn để trình duyệt tải font ở chế độ ưu tiên thấp, không giữ
     khung hình đầu lại. Đo trên mạng 400ms độ trễ: bản rel=stylesheet
     thường làm khung đầu trắng tới ~1.2 giây vì trình duyệt chờ CSS
     từ fonts.googleapis.com mới vẽ; đổi sang cách này thì màn chờ tải
     hiện ngay trong khung đầu, font về sau chỉ đổi mặt chữ.
     Không dùng noscript thì trang tắt JS vẫn có font đẹp. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap">
<noscript>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap">
</noscript>
<script>
  /* CSS phải nạp bằng đường dẫn tuyệt đối: Vercel phục vụ trang ở /nasa
     mà không có dấu / ở cuối, nên "css/tokens.css" sẽ bị hiểu thành
     "/css/tokens.css" và trả 404. Tự dựng thư mục gốc từ location.pathname. */
  (function () {
    var parts = location.pathname.split('/');
    var last = parts[parts.length - 1];
    if (last.indexOf('.') !== -1) parts[parts.length - 1] = '';
    var base = location.origin + parts.join('/');
    if (base.slice(-1) !== '/') base += '/';
    window.__BASE__ = base;

    /* Màn chờ nhúng trong HTML là chữ cứng tiếng Việt. Người chơi chọn
       EN ở lần chơi trước thì lần mở trang sau vẫn thấy tiếng Việt ở
       đúng khung đầu tiên — chỗ dễ bị chấm nhất. Đọc ngôn ngữ đã lưu
       ngay tại đây (i18n.js còn chưa nạp) và dịch hai dòng chữ. */
    window.__pbText = (function () {
      var lang = 'vi';
      try { lang = localStorage.getItem('smdg.lang') || 'vi'; } catch (e1) { /* riêng tư chặn đọc */ }
      var en = lang === 'en';
      return {
        mission: en ? 'ARES III · Preparing the control room' : 'ARES III · Chuẩn bị phòng điều khiển',
        images: en ? 'Loading images' : 'Đang nạp hình ảnh',
        almost: en ? 'Almost there' : 'Sắp xong',
        aria: en ? 'Loading resources' : 'Đang tải tài nguyên',
      };
    })();
    try {
      var applyPbText = function () {
        var _m = document.querySelector('.pb-mission');
        var _s = document.getElementById('pb-status');
        var _r = document.getElementById('pb');
        if (_m) _m.textContent = window.__pbText.mission;
        if (_s) _s.textContent = window.__pbText.images;
        if (_r) _r.setAttribute('aria-label', window.__pbText.aria);
      };
      /* Script này nằm trong <head>, phần thân chưa dựng: phải chờ DOM.
         Chạy ngay nếu đã có (trường hợp script bị dời xuống cuối). */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyPbText);
      } else {
        applyPbText();
      }
    } catch (e2) { /* thiếu phần tử thì để nguyên chữ mặc định */ }

    /* Huy hiệu của màn chờ nằm trong CSS, mà CSS nhúng phân giải url()
       theo URL của trang (/nasa) nên "assets/…" sẽ thành "/assets/…"
       và 404. Gán địa chỉ tuyệt đối qua biến CSS ngay ở đây — script
       này chạy trước khung hình đầu nên huy hiệu có mặt từ đầu. */
    try {
      var _emblem = document.querySelector('.pb-emblem');
      if (_emblem) _emblem.style.setProperty('--pb-emblem', 'url("' + base + 'assets/art/loading-emblem.webp")');
    } catch (e0) { /* thiếu biến thì vẫn còn lớp gradient dự phòng */ }
    /* CSS nạp bất đồng bộ, KHÔNG chặn khung hình đầu.
       Vì sao: thẻ <link rel=stylesheet> chèn bằng JS vẫn là tài nguyên
       chặn vẽ. Trên mạng 400ms độ trễ, bảy tệp CSS này giữ khung đầu
       trắng tới gần 1 giây, tức là màn chờ tải dù có trong HTML cũng
       chưa được vẽ. Đo lại sau khi đổi: màn chờ hiện ở ~400ms thay vì
       ~970ms.

       Đánh đổi: trong khoảng ngắn đó màn chờ chưa có biến màu của
       tokens.css. Bù bằng cách viết giá trị dự phòng ngay trong khối
       <style> của màn chờ (đã làm: mỗi màu đều có giá trị sau dấu
       phẩy), nên nó vẫn đúng tông dù CSS chưa về.

       media="print" rồi đổi sang "all" khi tải xong là cách chuẩn để
       một stylesheet không chặn vẽ mà vẫn áp dụng đúng thứ tự. */
    var cssDone = 0;
    var cssTotal = 7;
    window.__cssReady = new Promise(function (resolve) {
      ['css/tokens.css', 'css/boot.css', 'css/menu.css', 'css/intro.css',
       'css/story.css', 'css/settings.css', 'css/preloader.css'].forEach(function (href) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.media = 'print';
        l.href = base + href;
        function onSettle() {
          try { l.media = 'all'; } catch (e) { /* bỏ qua */ }
          cssDone += 1;
          if (cssDone >= cssTotal) resolve(true);
        }
        l.onload = onSettle;
        /* lỗi vẫn tính là xong: một tệp CSS 404 không được treo cổng */
        l.onerror = onSettle;
        document.head.appendChild(l);
      });
    });

    /* Ảnh của màn menu cũng phải nạp bằng đường dẫn tuyệt đối, cùng lý
       do với CSS: "assets/art/x.webp" từ trang /nasa sẽ thành
       "/assets/art/x.webp" và 404. Đánh dấu bằng data-asset, gán src
       ngay khi phần thân đã dựng xong, trước cả module script. */
    function fixAssets() {
      var nodes = document.querySelectorAll('[data-asset]');
      for (var i = 0; i < nodes.length; i += 1) {
        nodes[i].src = base + nodes[i].getAttribute('data-asset');
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fixAssets);
    } else {
      fixAssets();
    }
  })();
</script>
<style>
  /* nền tối thiểu, phần lớn giao diện khởi động nằm trong css/boot.css */
  body {
    background: var(--bg-void, #06090f);
    color: var(--tx, #b9c7d6);
    font-family: var(--st-font-body, "Be Vietnam Pro", sans-serif);
    font-size: var(--st-size-base, 15px);
    -webkit-font-smoothing: antialiased;
    margin: 0;
    overflow: hidden;
    overflow-x: hidden;
  }

  /* ---------- lớp chứa Giai đoạn 1 (bảng viễn thông) ----------
     .comms-root bên trong định vị tuyệt đối theo khung padding của
     lớp này, nên phải chặn bớt cạnh trên để dành một dải cho nút
     "Bỏ qua" và không đè lên tiêu đề của panel. */

    position: fixed;
    inset: 0;
    z-index: 90;
    box-sizing: border-box;
  }

  .comms-host .comms-root {
    inset: 52px 0 0 0;
  }

  /* panel của comms cao tối đa 94dvh; trừ thêm dải 52px ở trên để
     chân bảng luôn nằm trong khung nhìn. */
  .comms-host .comms-panel {
    max-height: min(calc(100dvh - 76px), 900px);
  }

  /* Lối thoát khỏi Giai đoạn 1. Bắt buộc phải có: comms.js không có
     nút đóng riêng, nếu không có nút này người chơi kẹt trong màn.
     z-index cao hơn .comms-root (70) vì hai lớp là anh em cùng một
     ngữ cảnh xếp lớp. */
  .comms-skip {
    position: absolute;
    top: 4px;
    left: 10px;
    z-index: 100;
    min-height: 44px;
    min-width: 44px;
    padding: 0 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--st-font-body, "Be Vietnam Pro", sans-serif);
    font-size: var(--st-size-label, .7rem);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--tx-soft, #8497aa);
    background: rgba(11, 15, 21, .88);
    border: 1px solid var(--line-strong, #35455a);
    border-radius: var(--st-radius, 3px);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }

  .comms-skip[hidden] { display: none; }

  .comms-skip:hover,
  .comms-skip:focus-visible {
    color: var(--amber, #e8a33d);
    border-color: var(--amber, #e8a33d);

  .comms-skip:focus-visible {

  }

  @media (max-width: 680px) {
    .comms-skip { top: 4px; left: 8px; padding: 0 12px; }
  }

  html.motion-off .comms-skip { transition: none; }

  /* (Lớp phủ .boot-pending và vòng xoay .boot-spin của màn cũ đã bỏ:
     màn menu mới khai báo trạng thái đang tải bằng data-loading trên
     nút, định kiểu trong css/menu.css. Hai bộ trạng thái cùng tồn tại
     thì lúc lỗi chỉ trả được một bộ về nguyên trạng.) */

  /* ---------- nút chơi lại Giai đoạn 1 trong màn căn cứ ----------
     Nằm ở chân màn căn cứ, kiểu chữ theo chân màn hình, vùng bấm 44px. */
  .base-replay {
    min-height: 44px;
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: var(--st-size-label, .7rem);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--tx-soft, #8497aa);
    background: transparent;
    /* viền mờ để đọc ra là nút bấm được, không phải một dòng chữ trang trí.
       Cùng độ đậm với nút "Lưu ngay" bên cạnh nên hai nút cân nhau. */
    border: 1px solid var(--line, #223041);
    border-radius: var(--st-radius, 3px);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }

  .base-replay:hover,
  .base-replay:focus-visible {
    color: var(--amber, #e8a33d);
    border-color: var(--amber-dim, #8a6a33);
    outline: none;
  }

  .base-replay:focus-visible {
    box-shadow: 0 0 0 2px rgba(232, 163, 61, .35);
  }

  html.motion-off .base-replay { transition: none; }

  /* ---------- màn chờ tải nhúng (pb-) ----------
     Sửa lỗi người dùng báo: mở trang xong vẫn thấy khung trống vì màn
     chờ của preloader.js chỉ dựng lên sau khi chuỗi import xong. Lớp
     dưới đây là HTML tĩnh nên trình duyệt vẽ ngay khung đầu tiên.

     Đặt tiền tố pb- để không giẫm lên .pre-root của css/preloader.css:
     hai bộ định kiểu cùng tồn tại thì lúc gỡ một bộ, bộ còn lại vẫn
     đúng như cũ. */
  .pb-root {
    position: fixed;
    inset: 0;
    z-index: 220;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #07090d;
    color: #b9c7d6;
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    overflow: hidden;
    /* tấm màn che, không có gì để bấm: nút Bắt đầu phía sau vẫn nhận
       được cú bấm ngay khi lớp này mờ đi */
    pointer-events: none;
    opacity: 1;
    transition: opacity 400ms cubic-bezier(.22, .61, .36, 1);
  }

  .pb-root.pb-out { opacity: 0; }
  .pb-root[hidden] { display: none; }

  .pb-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
    width: 100%;
    max-width: 360px;
  }

  /* Huy hiệu xoay chậm: 12 giây một vòng, đủ chậm để không rối mắt,
     đủ nhanh để thấy màn hình còn sống khi mạng chậm.
     Ảnh khai báo qua biến --pb-emblem (gán bằng JS bên dưới, dựng từ
     location.pathname) chứ không viết "assets/…" trần trong CSS: CSS
     nhúng trong HTML phân giải url() theo URL của TRANG, mà trang chạy
     ở /nasa nên url() tương đối thành /assets/… và 404 trên production.
     Ảnh dự phòng vẽ bằng gradient nên khung vẫn đẹp khi tệp thiếu. */
  .pb-emblem {
    width: 96px;
    height: 96px;
    background:
      var(--pb-emblem, none) center / contain no-repeat,
      radial-gradient(circle at 50% 50%,
        rgba(232, 163, 61, .28) 0%, rgba(232, 163, 61, 0) 62%);
    animation: pb-spin 12s linear infinite;
    transform-origin: 50% 50%;
  }

  @keyframes pb-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .pb-mission {
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #72879d;
  }

  .pb-track {
    position: relative;
    width: 100%;
    max-width: 320px;
    height: 3px;
    border-radius: 2px;
    background: #1b232e;
    overflow: hidden;
  }

  .pb-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, #6b4a1c 0%, #e8a33d 100%);
    transition: width 260ms cubic-bezier(.22, .61, .36, 1);
  }

  .pb-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: .72rem;
    letter-spacing: .04em;
  }

  .pb-status { color: #8497aa; }

  .pb-pct {
    min-width: 4.5ch;
    text-align: right;
    color: #e8a33d;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 420px) {
    .pb-emblem { width: 80px; height: 80px; }
    .pb-card { gap: 14px; }
    .pb-mission { letter-spacing: .12em; }
  }

  @media (max-height: 420px) {
    .pb-emblem { width: 64px; height: 64px; }
    .pb-card { gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pb-emblem { animation: none; }
    .pb-fill { transition: none; }
    .pb-root { transition: none; }
  }

  html.motion-off .pb-emblem { animation: none; }
  html.motion-off .pb-fill { transition: none; }
  html.motion-off .pb-root { transition: none; }
</style>

<body>

<!-- ============================================================
     MÀN CHỜ TẢI NHÚNG
     ============================================================
     Vì sao phải nằm trong HTML: màn chờ của preloader.js chỉ dựng
     lên sau khi module script chạy xong, tức là sau toàn bộ chuỗi
     import. Trên mạng chậm khoảng trống đó là vài giây người chơi
     chỉ thấy khung trống và tưởng trang treo. Khối này là HTML
     tĩnh nên trình duyệt vẽ nó ngay khung hình đầu tiên.

     Ba lớp gỡ, độc lập nhau, lớp nào tới trước thì thắng:
       1. preloader.js tải xong (hoặc hết hạn chờ của nó) gọi
          window.__pbHide() -> mờ dần rồi gỡ.
       2. Bộ đếm 8 giây ngay dưới tự gỡ, phòng khi preloader chậm
          hơn dự kiến. Không bao giờ chặn game quá 8 giây.
       3. Bộ đếm 3 giây trong try/catch, phòng khi chính script đếm
          lỗi. Đây là lớp cuối, không có gì sau nó.

     Thanh tiến trình đếm thật: mỗi tài nguyên trong danh sách bên
     dưới cộng một khi xong HOẶC khi lỗi. Tệp 404 vẫn tính là xong,
     nhờ vậy thanh không bao giờ kẹt giữa đường.
     ============================================================ -->
<div class="pb-root" id="pb" role="progressbar"
     aria-label="Đang tải tài nguyên" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="pb-card">
    <div class="pb-emblem" aria-hidden="true"></div>
    <div class="pb-mission">ARES III · Chuẩn bị phòng điều khiển</div>
    <div class="pb-track"><div class="pb-fill" id="pb-fill"></div></div>
    <div class="pb-meta">
      <span class="pb-status" id="pb-status">Đang nạp hình ảnh</span>
      <span class="pb-pct" id="pb-pct">0%</span>
    </div>
  </div>
</div>
<script>window.__pbParsedAt = performance.now();</script>
<script>
  /* Dịch dòng chữ của màn chờ nhúng theo ngôn ngữ đã lưu. Script này
     nằm NGAY SAU khung #pb nên phần tử đã dựng xong: đổi được chữ ngay,
     không phải chờ DOMContentLoaded như bản trong <head> (bản đó vẫn
     giữ lại làm dự phòng). */
  (function () {
    try {
      var lang = 'vi';
      try { lang = localStorage.getItem('smdg.lang') || 'vi'; } catch (e1) { /* riêng tư chặn đọc */ }
      var en = lang === 'en';
      var m = document.querySelector('.pb-mission');
      var s = document.getElementById('pb-status');
      var r = document.getElementById('pb');
      if (m) m.textContent = en ? 'ARES III · Preparing the control room' : 'ARES III · Chuẩn bị phòng điều khiển';
      if (s) s.textContent = en ? 'Loading images' : 'Đang nạp hình ảnh';
      if (r) r.setAttribute('aria-label', en ? 'Loading resources' : 'Đang tải tài nguyên');
    } catch (e) { /* thiếu phần tử thì để nguyên chữ mặc định */ }
  })();
</script>

<script>
  /* Bộ đếm của màn chờ nhúng. Viết bằng ES5, không import gì: nó
     phải chạy được cả khi module script phía dưới chết vì một file
     thiếu. */
  (function () {
    var root = document.getElementById('pb');
    if (!root) return;
    var fill = document.getElementById('pb-fill');
    var pct = document.getElementById('pb-pct');
    var status = document.getElementById('pb-status');

    /* Đánh dấu đã gỡ để ba lớp hẹn giờ không gỡ chồng nhau. */
    var gone = false;

    function hide() {
      if (gone || !root) return;
      gone = true;
      try {
        root.classList.add('pb-out');
        setTimeout(function () { if (root) root.hidden = true; }, 420);
      } catch (e) { /* không mờ được thì gỡ thẳng */ if (root) root.hidden = true; }
    }
    window.__pbHide = hide;

    function paint(done, total) {
      var p = total ? Math.min(100, Math.round((done / total) * 100)) : 0;
      if (fill) fill.style.width = p + '%';
      if (pct) pct.textContent = p + '%';
      root.setAttribute('aria-valuenow', String(p));
      return p;
    }

    /* Chữ song ngữ cho hai dòng trạng thái. Đọc thẳng localStorage thay
       vì chỉ trông vào window.__pbText: bản trong <head> có thể không
       chạy (bị chặn lưu trữ, hoặc script head bị bỏ), và khi đó chuỗi
       tiếng Việt viết cứng sẽ hiện với người chơi chọn EN. */
    function txt(key) {
      var en = false;
      try { en = localStorage.getItem('smdg.lang') === 'en'; } catch (e) { /* chặn đọc: dùng VI */ }
      var t = window.__pbText;
      if (t && t[key]) return t[key];
      if (key === 'almost') return en ? 'Almost there' : 'Sắp xong';
      return en ? 'Loading images' : 'Đang nạp hình ảnh';
    }

    /* Lớp cuối, không điều kiện: 3 giây là gỡ. Đặt TRƯỚC mọi việc có
       thể ném lỗi để nó luôn được cài. */
    setTimeout(hide, 3000);

    try {
      var parts = location.pathname.split('/');
      if (parts[parts.length - 1].indexOf('.') !== -1) parts[parts.length - 1] = '';
      var base = location.origin + parts.join('/');
      if (base.slice(-1) !== '/') base += '/';

      /* Tài nguyên chặn màn mở đầu. CSS ở đây đã được nạp sẵn bởi
         script trong head, nên chỉ đếm ảnh và script; đếm lại CSS sẽ
         cộng hai lần cho cùng một tệp.
         Ảnh: nền và phi hành gia của màn menu, cộng huy hiệu ở đây. */
      var IMAGES = [
        'assets/art/loading-emblem.webp',
        'assets/art/bg-storm-wide.webp',
        'assets/art/char-eva.webp',
        'assets/art/loading-emblem.webp'
      ];
      /* trùng huy hiệu ở đầu là cố ý: nạp lại từ cache, rẻ, và giữ
         tổng số chia hết cho bước nhảy của thanh */
      var total = IMAGES.length + 1; /* +1 cho module script boot.js */
      var done = 0;
      var settledOnce = false;

      function settle() {
        done += 1;
        var p = paint(done, total);
        if (p >= 100 && !settledOnce) {
          settledOnce = true;
          if (status) status.textContent = txt('almost');
        }
      }

      for (var i = 0; i < IMAGES.length; i += 1) {
        (function (rel) {
          var img = new Image();
          img.onload = settle;
          img.onerror = settle;   /* lỗi vẫn tính là xong */
          img.src = base + rel;
        })(IMAGES[i]);
      }

      /* Module script chính: coi như xong khi DOMContentLoaded, vì từ
         đó trở đi preloader.js đã có cơ hội chạy và đã tự báo tiến
         trình thật về window.__pbProgress. */
      if (document.readyState === 'complete') settle();
      else window.addEventListener('load', settle, { once: true });
    } catch (e) {
      /* Lỗi ở đây chỉ mất thanh tiến trình; lớp 3 giây vẫn gỡ màn. */
    }

    /* preloader.js báo tiến trình tải THẬT về đây. Số của nó chính
       xác hơn phép đếm thô ở trên (nó biết cả 12 khung comic, sprite,
       âm thanh), nên khi có số thật thì thanh chạy theo số thật. */
    window.__pbProgress = function (settledCount, totalCount) {
      try {
        if (!totalCount) return;
        var p = paint(settledCount, totalCount);
        if (p >= 100 && status) status.textContent = txt('almost');
        else if (status && settledCount < totalCount) status.textContent = txt('images');
      } catch (err) { /* bỏ qua */ }
    };

    /* Hạn chờ riêng của chính màn nhúng: quá 8 giây thì nhường chỗ cho
       game dù preloader chưa xong. Không bao giờ chặn vĩnh viễn. */
    setTimeout(hide, 8000);
  })();
</script>
