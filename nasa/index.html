<script type="module">
  /* Vercel phục vụ trang ở /nasa không có dấu / cuối. Khi đó đường dẫn
     tương đối "./story.js" bị hiểu thành "/story.js" và trả 404.
     Vì vậy mọi import phải dùng URL tuyệt đối dựng từ thư mục hiện tại. */
  const _p = location.pathname.split('/');
  if (_p[_p.length - 1].indexOf('.') !== -1) _p[_p.length - 1] = '';
  const BASE = location.origin + _p.join('/').replace(/\/?$/, '/');

  /* Màn chờ tải bật ngay từ đây, trước cả khi nạp nốt các module còn
     lại. Trên mạng yếu, mấy lần import bên dưới cũng mất vài giây, và
     khoảng trắng đó chính là chỗ người chơi tưởng trang bị treo. Chạy
     nền, không chờ, để nút Bắt đầu vẫn dùng được như thường. */
  /* Nạp mềm: thiếu file phụ thì game vẫn chạy, chỉ mất màn chờ.
     Trước đây import cứng nên một file chưa deploy là cả trang chết
     đứng, nút Bắt đầu bấm không phản ứng gì. */
  let runPreloader = async () => ({ ok: true, failed: [] });
  /* Cổng chặn chuyển cảnh: bọc mọi lần đổi màn lớn để không lộ khung
     trống trong lúc dựng ảnh. Nếu preloader không nạp được thì cổng
     chỉ gọi thẳng việc cần làm, game vẫn chạy bình thường. */
  let gate = async (job, opts) => (typeof job === 'function' ? job() : undefined);
  try {
    const pre = await import(BASE + 'preloader.js');
    if (pre && typeof pre.startPreloader === 'function') pre.startPreloader();
    if (pre && typeof pre.runPreloader === 'function') runPreloader = pre.runPreloader;
    if (pre && typeof pre.gate === 'function') gate = pre.gate;
  } catch (err) {
    console.warn('[boot] chưa nạp được màn chờ, vào thẳng game', err);
  }

  /* Màn kể chuyện cũ chỉ được nạp khi thật sự cần: nó là đường dự phòng
     cho prologue, và là đường chính khi prologue không nạp được. Nạp
     muộn cũng làm khung khởi động nhẹ hơn, vì story.js kéo theo
     story-data.js và story-fx.js. */
  let _startStory = null;
  async function getStartStory() {
    if (_startStory) return _startStory;
    const mod = await import(BASE + 'story.js');
    if (!mod || typeof mod.startStory !== 'function') throw new Error('story.js không export startStory');
    _startStory = mod.startStory;
    return _startStory;
  }

  /* Prologue là màn mở đầu mới: mười hai khung truyện tranh, không lời
     thoại. Nếu file không nạp được, hoặc nạp xong mà không dựng được
     lớp .prologue-root, hàm dưới trả null và nơi gọi quay về story.
     Không để một lỗi ở màn mở đầu làm kẹt cả game. */
  async function getStartPrologue() {
    try {
      const mod = await import(BASE + 'prologue.js');
      if (mod && typeof mod.startPrologue === 'function') return mod.startPrologue;
    } catch (e) {
      /* thiếu file, sai cú pháp, hay 404 trên production: nuốt lỗi và
         để đường dự phòng chạy */
    }
    return null;
  }

  const { startBase, resumeFromSave } = await import(BASE + 'base.js');
  const { hasSave, getSaveInfo }     = await import(BASE + 'save-game.js');
  const { startComms }      = await import(BASE + 'comms.js');
  const { startRescueDesigner } = await import(BASE + 'rescue-designer.js');
  const { startFlight }     = await import(BASE + 'flight.js');
  const { openBeaconScene } = await import(BASE + 'beacon.js');
  const { playIntro }       = await import(BASE + 'intro-video.js');
  const { applyToDom, onLangChange, t, getLang } = await import(BASE + 'i18n.js');
  const { loadSettings }    = await import(BASE + 'settings.js');
  const { initAudio, bindClickSounds, playClick } = await import(BASE + 'audio.js');
  const { openSettings }    = await import(BASE + 'settings-ui.js');

  /* Nút Báo lỗi ở menu chính. Nạp mềm để thiếu file cũng không làm
     chết nút Bắt đầu; nạp xong thì điền sẵn địa chỉ mailto kèm thông
     tin máy, và cập nhật lại mỗi khi đổi ngôn ngữ vì tiêu đề thư đổi
     theo ngôn ngữ. */
  import(BASE + 'report.js').then((mod) => {
    if (mod && typeof mod.bindReportButtons === 'function') {
      mod.bindReportButtons();
      mod.refreshReportHrefs();
      if (typeof onLangChange === 'function') {
        onLangChange(() => mod.refreshReportHrefs());
      }
    }
  }).catch((err) => {
    console.warn('[boot] chưa nạp được nút báo lỗi', err);
  });

  /* cài đặt và âm thanh nạp trước khi người chơi bấm Bắt đầu,
     để nhạc nền và cỡ chữ đúng ngay từ khung đầu */
  loadSettings();
  initAudio();
  applyToDom();

  /* Cầu nối Giai đoạn 2 sang màn kết thúc thua. Cài một lần ở đây để
     bất kỳ engine Phase 2 nào phát 'mission:failed' cũng mở được màn
     kết thúc, dù app Giai đoạn 2 có subscribe hay không. Nạp động và
     nuốt lỗi: thiếu file thì game vẫn chạy, chỉ là không có màn kết
     thúc cho Giai đoạn 2. */
  import(BASE + 'phase2-endings-bridge.js').then((mod) => {
    if (mod && typeof mod.installPhase2EndingsBridge === 'function') {
      mod.installPhase2EndingsBridge();
    }
  }).catch((err) => {
    console.warn('[boot] chưa nạp được cầu nối màn kết thúc', err);
  });

  const boot = document.getElementById('boot');
  const btn  = document.getElementById('start');

  /* Dọn dấu vết của lần chạy trước (xem resetMenuButton để biết vì sao
     cần). Đặt ngay sau khi có nút, trước mọi thứ khác, để nếu trang
     được khôi phục từ bfcache hay vừa reload sau khi bấm "Bắt đầu sứ
     mệnh mới" thì nút vẫn bấm được. */
  try { resetMenuButton(); } catch (e) { /* hàm khai báo sau, bỏ qua */ }
  const gear = document.getElementById('settings-btn');

  /* Cờ đặt ở phạm vi ngoài, không đặt trong callback. Nếu đặt trong
     callback thì mỗi lần onFinish được gọi lại tạo một cờ mới, và cờ
     đó luôn là false, nên không chặn được gì. */
  let baseStarted = false;

  /* ---------- Giai đoạn 1: bảng điều khiển viễn thông ----------
     Màn đầu tiên sau khi tỉnh dậy: gọi cứu xong mới quản lý căn cứ.
     Cờ dưới đây để lần sau vào game không phải làm lại ba bước. */
  const STAGE1_KEY = 'smdg.stage1Done';

  function stage1Done() {
    try { return localStorage.getItem(STAGE1_KEY) === '1'; } catch (e) { return false; }
  }

  /* Mở bảng viễn thông trong một lớp phủ riêng.
     comms.js không có nút đóng nội bộ, nên nút "Bỏ qua" ở đây là lối
     thoát duy nhất. Cả hai đường ra (xong ba bước, hoặc bỏ qua) đều
     gọi comms.destroy() rồi gỡ lớp phủ trước khi đi tiếp, nhờ vậy
     không bao giờ còn khung trắng hay panel nằm lại trên màn căn cứ. */
  function openStage1({ onDone, onSkip }) {
    /* Chặn mở hai lần. onFinish của màn truyện có thể chạy lặp nếu
       người chơi bấm dồn ở lượt cuối, và mỗi lần gọi sẽ dựng thêm một
       lớp phủ chồng lên lớp trước, khiến cú bấm rơi vào panel bên dưới
       và trạng thái ba bước bị lệch. */
    if (document.querySelector('.comms-host')) return null;

    const host = document.createElement('div');
    host.className = 'comms-host';
    document.body.appendChild(host);

    const skip = document.createElement('button');
    skip.type = 'button';
    skip.className = 'comms-skip';
    skip.textContent = t('comms.skip');
    host.appendChild(skip);

    /* Cả hai đường ra đều đánh dấu đã qua Giai đoạn 1. Nếu chỉ đánh
       dấu ở đường hoàn thành thì người bấm "Bỏ qua" sẽ bị hỏi lại màn
       này ở lần vào game sau. */
    function markDone() {
      try { localStorage.setItem(STAGE1_KEY, '1'); } catch (e) { /* trình duyệt chặn ghi thì vẫn đi tiếp */ }
    }

    let closed = false;
    const comms = startComms({
      container: host,
      onDone: () => {
        if (closed) return;
        closed = true;
        markDone();
        if (comms && typeof comms.destroy === 'function') comms.destroy();
        host.remove();
        /* Phát xong là kết thúc Giai đoạn 1. Trước khi chuyển sang phần
           thiết kế tàu cứu hộ, chạy đoạn trạm mặt đất nhận tin. Đây là
           chỗ Minh Ngọc đang vẽ tranh comic; chưa có tranh thì module
           vẫn chạy bằng khung dựng tạm, không chặn luồng. */
        openBeaconScene({
          onDone: () => {
            /* Chèn màn mười ba khung nối Giai đoạn 1 sang Giai đoạn 2.
               Nạp mềm: thiếu file thì đi thẳng tới màn thiết kế tàu cứu
               hộ, không để một màn phim làm kẹt luồng chơi. */
            let started = false;
            const goNext = () => {
              if (started) return;
              started = true;
              if (typeof onDone === 'function') onDone();
            };
            import(BASE + 'intermission.js').then((mod) => {
              if (!mod || typeof mod.openIntermission !== 'function') { goNext(); return; }
              const st = (window.__devBase && window.__devBase.stats) || null;
              mod.openIntermission({ stats: st, onDone: goNext });
            }).catch((err) => {
              console.warn('[boot] chưa nạp được màn chuyển tiếp, đi tiếp', err);
              goNext();
            });
          },
        });
      },
    });

    skip.addEventListener('click', () => {
      playClick();
      if (closed) return;
      closed = true;
      markDone();
      if (comms && typeof comms.destroy === 'function') comms.destroy();
      host.remove();
      if (typeof onSkip === 'function') onSkip();
    });

    return {
      destroy: () => {
        if (closed) return;
        closed = true;
        if (comms && typeof comms.destroy === 'function') comms.destroy();
        host.remove();
      },
    };
  }

  /* Vào màn căn cứ. Tách riêng vì có hai đường vào: sau Giai đoạn 1,
     và vào thẳng khi cờ đã có sẵn. */
  function enterBase(playerName) {
    if (baseStarted) return;
    baseStarted = true;

    /* Chặn màn trong lúc dựng căn cứ: ảnh nền và sprite cần vài trăm ms,
       không chặn thì lộ khung trống. */
    gate(() => {
      const host = document.createElement('div');
      host.className = 'base-host';
      document.body.appendChild(host);
      startBase({
      container: host,
      playerName,
      onExit: () => {
        host.remove();
        baseStarted = false;
        boot.style.display = '';
        delete btn.dataset.started;
      },
      /* Sau khi gửi được tín hiệu cầu cứu và lo xong căn cứ, người chơi
         bước sang nửa còn lại của game: thiết kế tàu cứu hộ từ Trái Đất
         rồi bay 258,9 ngày. Đây là phần chiếm phần lớn điểm số. */
      onLaunchRescue: () => openRescueDesigner(playerName),
      });
    });
  }

  /* Màn thiết kế tàu cứu hộ. Xong thì vào màn bay.
     ĐÂY LÀ ĐƯỜNG CHÍNH: Giai đoạn 2 (bốn bước CML, đồng hồ đo, bản đồ
     quỹ đạo, màn kết thúc) là phần chiếm phần lớn điểm số và là thứ
     README lẫn pitch deck mô tả. Trước đây hàm này mở rescue-designer
     rồi flight rồi hết, khiến toàn bộ phase2/ (hơn 3.800 dòng) không
     bao giờ tới được tay người chơi: mountPhase2 chỉ được gọi từ bảng
     dev. Nối vào đây thì mọi đường chơi thật đều đi qua Giai đoạn 2.

     Giữ rescue-designer làm đường dự phòng: nếu phase2/ không nạp được
     (thiếu file, lỗi import) thì rơi về xưởng thiết kế cũ thay vì để
     người chơi nhìn khung trống. Không bao giờ mất cả hai. */
  function openRescueDesigner(playerName) {
    gate(() => openPhase2OrFallback(playerName));
    return { destroy: () => { const h = document.querySelector('.p2-host, .rescue-host'); if (h) h.remove(); } };
  }

  /* Bàn giao tín hiệu cầu cứu từ Giai đoạn 1 sang Giai đoạn 2.

     Vì sao cần: bước 1 của Phase 2 (bắt sóng) KHÔNG tự chạy. Nó chờ
     sự kiện 'mars:sos-received' rồi mới khoá sóng và mở phần chọn
     mục tiêu; không có sự kiện thì radar quét mãi, nút "Sang bước 2"
     khoá vĩnh viễn. Trước đây sự kiện này chỉ được phát từ bảng dev,
     nên đường chơi thật vào Phase 2 xong là đứng hình ở bước 1.

     Số liệu lấy từ bản lưu thật của Giai đoạn 1 (nước, calo, tinh
     thần, ngày đã sống) để trễ liên lạc và số sol còn lại khớp với
     những gì người chơi vừa trải qua, không phải con số bịa. */
  function handOffSosToPhase2() {
    /* Không dùng cờ "đã phát" toàn cục: mỗi lần mount là một màn mới,
       và lượt chơi lại sau khi thua phải nhận được sóng như lượt đầu.
       Gọi đúng một lần cho mỗi lần mount là đủ, vì openPhase2OrFallback
       đã có cờ chống mở chồng. */
    const detail = { source: 'phase1' };

    /* Số liệu sống còn của Giai đoạn 1 do hab-stats.js ghi. */
    try {
      const raw = localStorage.getItem('smdg.stats');
      if (raw) {
        const d = JSON.parse(raw) || {};
        const st = d.stats || d;
        const nums = ['water', 'calories', 'sanity']
          .map((k) => (Number.isFinite(st[k]) ? st[k] : null))
          .filter((v) => v !== null);
        if (nums.length) {
          /* Nước là thứ cạn trước và quyết định sống còn, nên lấy
             mức thấp nhất trong ba chỉ số làm "dưỡng chất còn lại".
             Đây là con số mà bản ghi sóng hiển thị. */
          detail.lifeSupportPercent = Math.max(0, Math.min(100, Math.min.apply(null, nums)));
        }
      }
    } catch (e) { /* bản lưu hỏng: dùng mặc định của engine */ }

    /* Ngày đã sống lấy từ bản lưu để quy ra số sol còn lại trên mốc
       300 sol của kịch bản. Không có bản lưu thì để engine tự quyết. */
    try {
      const info = getSaveInfo();
      if (info && Number.isFinite(info.day) && info.day > 0) {
        detail.solsRemaining = Math.max(0, 300 - info.day);
      }
    } catch (e) { /* chưa có bản lưu */ }

    /* Ưu tiên cầu nối chính thức của Phase 2: nó ghi trạng thái chia
       sẻ, phát sự kiện và đẩy số liệu vào engine. */
    const bridge = window.phase2Bridge;
    if (bridge && typeof bridge.simulateSosFromPhase1 === 'function') {
      bridge.simulateSosFromPhase1(detail);
      return;
    }
    /* Không có cầu nối thì phát thẳng sự kiện. Bước 1 nghe đúng tên
       này nên vẫn nhận được sóng. */
    const payload = Object.assign({ solsRemaining: 288, crewOnMars: 1, signalStrength: 0.72 }, detail);
    try {
      window.dispatchEvent(new CustomEvent('mars:sos-received', { detail: payload }));
    } catch (e) { /* trình duyệt không dựng được CustomEvent */ }
    window.MARS_RESCUE_SHARED_STATE = Object.assign({}, window.MARS_RESCUE_SHARED_STATE || {}, {
      sos: payload, sosReceived: true, stage: 'received',
    });
  }

  /* Cờ chống mở chồng. Người chơi bấm thẻ hai lần liền, hoặc bấm rồi
     Enter, sẽ tạo hai khung .p2-host chồng nhau; khung trên không có
     __phase2Api nên nuốt mọi cú bấm mà không có lối thoát. Gộp các
     lượt mở trùng thành một. */
  let phase2Opening = false;

  /* Mở Giai đoạn 2 thật; hỏng thì lùi về xưởng thiết kế cũ. */
  async function openPhase2OrFallback(playerName) {
    if (phase2Opening) return;
    phase2Opening = true;
    try {
      await openPhase2OrFallbackOnce(playerName);
    } finally {
      phase2Opening = false;
    }
  }

  async function openPhase2OrFallbackOnce(playerName) {
    const host = document.createElement('div');
    host.className = 'p2-host';
    host.style.cssText = 'position:fixed;inset:0;z-index:80;background:#070915;';
    document.body.appendChild(host);

    /* Đường dẫn ứng viên. Bản deploy gom src/ về gốc /nasa nên phase2/
       nằm NGAY CẠNH index.html: BASE đã trỏ đúng thư mục chứa trang,
       nên 'phase2/' là đường đúng và phải thử trước. '../phase2/' chỉ
       đúng khi chạy http.server trong src/ (máy dev), để sau. Hai
       đường tuyệt đối còn lại là lưới an toàn cho cấu trúc khác.
       Thử lần lượt vì chỉ một trong số đó tồn tại trên từng bản. */
    const P2 = [BASE + 'phase2/', BASE + '../phase2/', '/nasa/phase2/', '/phase2/'];
    async function loadP2(file) {
      for (const base of P2) {
        try { return await import(base + file); } catch (e) { /* thử tiếp */ }
      }
      return null;
    }

    /* Màn giới thiệu Hồi 1 nếu có; thiếu module thì vào thẳng. */
    try {
      const intro = await loadP2('feature-act-intro.js');
      if (intro && typeof intro.mountActIntro === 'function') {
        await new Promise((resolve) => {
          let inst = null;
          let settled = false;
          let timer = 0;
          /* Chốt an toàn phải GỠ màn giới thiệu, không chỉ resolve.
             Nếu chỉ resolve, listener cấp document của nó (pointerdown
             và keydown bắt Space/Enter) còn nằm lại vĩnh viễn và nuốt
             phím của Phase 2 phía dưới. Thời gian chờ nới rộng để
             người đọc chậm không bị cắt ngang giữa lúc đọc hồ sơ. */
          const done = () => {
            if (settled) return;
            settled = true;
            if (timer) clearTimeout(timer);
            try { if (inst) inst.destroy(); } catch (e) { /* đã gỡ rồi */ }
            resolve();
          };
          timer = setTimeout(done, 45000);
          try {
            inst = intro.mountActIntro({ container: host, onDone: done });
            /* onDone có thể được gọi ngay bên trong mountActIntro, lúc
               đó inst còn null nên chưa gỡ được gì. Gỡ bù ở đây. */
            if (settled && inst && typeof inst.destroy === 'function') inst.destroy();
          } catch (e) {
            console.warn('[boot] màn giới thiệu Giai đoạn 2 lỗi, vào thẳng', e);
            done();
          }
        });
      }
    } catch (e) {
      console.warn('[boot] không nạp được màn giới thiệu Giai đoạn 2, vào thẳng', e);
    }

    try {
      const mod = await loadP2('phase2-app.js');
      if (mod && typeof mod.mountPhase2 === 'function') {
        await mod.mountPhase2({ container: host });
        /* Bàn giao tín hiệu cầu cứu SAU khi app đã dựng xong: listener
           của bước 1 chỉ được gắn trong lúc mountPhase2, phát sớm hơn
           thì không ai bắt. */
        try { handOffSosToPhase2(); } catch (e) {
          console.warn('[boot] không bàn giao được tín hiệu cầu cứu sang Giai đoạn 2', e);
        }
        return;
      }
      throw new Error('phase2-app.js không export mountPhase2');
    } catch (err) {
      console.warn('[boot] Giai đoạn 2 không nạp được, dùng xưởng thiết kế dự phòng', err);
      host.remove();
      // Đường dự phòng: xưởng thiết kế cũ, rồi màn bay cũ.
      try {
        const host2 = document.createElement('div');
        host2.className = 'rescue-host';
        document.body.appendChild(host2);
        startRescueDesigner({
          container: host2,
          onDone: (design) => {
            host2.remove();
            openFlight(playerName, design);
          },
        });
      } catch (err2) {
        console.error('[boot] cả Giai đoạn 2 lẫn xưởng dự phòng đều hỏng', err2);
      }
    }
  }


  /* Màn bay: bản đồ quỹ đạo ghép đàm phán vai trò. Bay hết 258,9 ngày
     thì phải mở MÀN KẾT THÚC THẬT, không phải chỉ gỡ khung bay:
       - tới đích, đội còn đứng cùng nhau  -> true-ending.js
         (chín khung phim + bảng tổng kết xếp hạng S/A/B + đối chiếu
          Curiosity / Perseverance / MAVEN)
       - đội vỡ giữa đường                -> endings.js
         (cảnh thua + báo cáo phân tích vì sao hỏng + cách sửa)
     Trước đây onDone chỉ gỡ khung bay rồi ghi localStorage, nên người
     chơi bay xong 258,9 ngày thì màn bay biến mất và họ nhìn lại màn
     căn cứ cũ: không điểm, không lời giải thích thắng/thua. Đề bài NASA
     bắt buộc "mission simulation + evaluation system with feedback on
     WHY it succeeded or failed", nên đây là chỗ mất điểm nặng nhất.
     Nếu cả hai module đều không nạp được thì vẫn dựng bảng tổng kết
     đơn giản bằng DOM trần: không bao giờ để màn hình trắng. */
  function openFlight(playerName, design) {
    const host = document.createElement('div');
    host.className = 'flight-host';
    document.body.appendChild(host);

    let flight = null;
    let settled = false;
    /* flight.js chỉ gọi onDone khi tàu tới đích. Đội vỡ thì nó dừng ở
       thẻ "đội tan rã" nội bộ và không báo ra ngoài, nên phải tự canh
       cờ mutiny để lần thua cũng có màn kết thúc có giải thích. */
    let watch = 0;

    /* ---------- đọc số thật ----------
       hab-stats.js ghi {stats, inv} vào smdg.stats, còn endings.js đọc
       phẳng stats.day / stats.oxygen / ... nên phải bóc lớp vỏ. (Bản
       trong phase2-endings-bridge.js truyền nguyên object có vỏ, nên
       màn kết thúc ở đó luôn hiện "chưa qua ngày nào".) */
    function flatStats() {
      let box = null;
      try { box = JSON.parse(localStorage.getItem('smdg.stats') || 'null'); } catch (e) { box = null; }
      let s = {};
      if (box && typeof box === 'object') {
        s = (box.stats && typeof box.stats === 'object') ? { ...box.stats } : { ...box };
      }
      if (!Number.isFinite(Number(s.day)) && Number.isFinite(Number(s.totalMinutes))) {
        s.day = Math.floor(Number(s.totalMinutes) / 1440) + 1;
      }
      return s;
    }

    const numOrNull = (v) => (Number.isFinite(Number(v)) ? Number(v) : null);

    /* ---------- số liệu thiết kế ----------
       Thiết kế đi vào đây theo hai dạng:
         - từ xưởng cứu hộ: có summary tính sẵn (wetMass_kg, cost_musd)
         - từ bảng test: chỉ có tên, không có mô-đun nào
       Dạng thứ hai nếu để nguyên thì màn kết thúc in "chưa có số" ở
       khối lượng và chi phí, trông như game hỏng. Tính lại từ
       moduleIds khi thiếu, bằng đúng nasa-data.js mà xưởng dùng, nên
       con số vẫn là số thật chứ không phải bịa. */
    function summaryOf(d) {
      const s = (d && d.summary) || null;
      if (s && Number.isFinite(Number(s.wetMass_kg))) return Promise.resolve(s);
      const ids = (d && Array.isArray(d.moduleIds)) ? d.moduleIds : null;
      if (!ids || !ids.length) return Promise.resolve(s);
      return import(BASE + 'nasa-data.js')
        .then((nd) => {
          const built = nd.summarizeModules(ids);
          /* Isp lấy từ động cơ đầu tiên, đúng cách xưởng chọn động cơ. */
          const isp = Number(d.isp_s)
            || Number((built.engines && built.engines[0] && built.engines[0].isp_s))
            || 0;
          if (isp > 0) {
            built.dvAvailable_ms = nd.availableDeltaV_ms(built, isp);
          }
          return built;
        })
        .catch(() => s);
    }

    /* Hạn mức chi phí của xưởng cứu hộ (rescue-designer.js: BUDGET_MUSD).
       Chép lại ở đây thay vì import cả xưởng chỉ để lấy một hằng số:
       xưởng nặng và kéo theo cả cây giao diện. Lệch số thì chỉ ảnh
       hưởng nhãn "ngân sách còn dư", không ảnh hưởng luồng chơi. */
    const BUDGET_MUSD = 700;

    /* Phần trăm ngân sách còn dư. true-ending.js dùng con số này để
       xét hạng S/A; không truyền thì nó coi như "không có dữ liệu" và
       bỏ qua tiêu chí, nên một ván vượt ngân sách vẫn có thể lên S. */
    function budgetLeftPct(sum) {
      const cost = numOrNull(sum && sum.cost_musd);
      if (cost === null) return null;
      return ((BUDGET_MUSD - cost) / BUDGET_MUSD) * 100;
    }

    /* true-ending.js đọc số qua stats.get() và engine.getState(). Màn
       bay không giữ hai đối tượng đó, nên dựng một cầu mỏng trả đúng
       hình dạng chúng chờ: khối lượng ướt và chi phí lấy từ thiết kế
       người chơi vừa chọn ở xưởng, thời gian bay lấy từ kết quả thật. */
    function engineShim(result, facts) {
      const sum = facts.summary || {};
      const days = numOrNull(result && result.elapsedDays);
      const dv = numOrNull(facts.deltaV);
      return {
        getState() {
          const totals = {};
          const mass = numOrNull(sum.wetMass_kg);
          if (mass !== null) totals.massKg = mass;
          if (days !== null) totals.daysToArrival = days;
          if (dv !== null) totals.deltaVAvailableMs = dv;
          /* costMusd KHÔNG đưa vào totals: true-ending.js in nó vào ô
             "Ngân sách còn dư", nên 631 M tổng chi phí sẽ hiện thành
             ngân sách còn dư 631 M. Chỉ truyền phần trăm còn lại, đúng
             nghĩa của nhãn đó. */
          const state = { totals };
          const leftPct = budgetLeftPct(sum);
          if (leftPct !== null) state.budgetRemainingPct = leftPct;
          return state;
        },
      };
    }

    /* Chỉ nhét khoá nào có số thật: endings.js đổi null thành "0" nên
       khoá thiếu thì cả hàng bị bỏ, còn null thì thành "0 m/s" sai. */
    function flightExtra(result, facts) {
      const sum = facts.summary || {};
      const out = {};
      const dv = numOrNull(facts.deltaV);
      const mass = numOrNull(sum.wetMass_kg);
      const cost = numOrNull(sum.cost_musd);
      const days = numOrNull(result && result.elapsedDays);
      if (dv !== null) out.deltaVMs = dv;
      if (mass !== null) out.massKg = mass;
      if (cost !== null) out.costMusd = cost;
      if (days !== null) out.daysToArrival = days;
      return out;
    }

    /* Thua vì đội vỡ là 'mutiny'; thua mà không vỡ đội thì tàu không
       vào được quỹ đạo, đúng cảnh 'orbit_miss'. */
    function loseEndingId(result) {
      const neg = (result && result.negotiationState) || null;
      if (neg && (neg.mutiny || Number(neg.cohesion) <= 0)) return 'mutiny';
      return 'orbit_miss';
    }

    /* ---------- về menu / chơi lại ---------- */

    /* Trả nút menu về trạng thái bấm được.

       Vì sao cần: khi người chơi bấm "Bắt đầu", boot-feedback.js gắn
       class is-pending và đặt disabled=true để hiện vòng xoay "Đang tải".
       Bình thường chuyện đó vô hại vì nút bị màn chơi che mất. Nhưng có
       hai đường khiến nút chết cứng:
         1. Bấm "Bắt đầu sứ mệnh mới" ở màn kết thúc -> restartMission()
            gọi location.reload(). Trạng thái disabled nằm trong DOM và
            được dựng lại y nguyên khi trang tải lại, không ai gỡ.
         2. Trình duyệt khôi phục trang từ bfcache (bấm Back), DOM sống
            dậy với đúng class cũ.
       Đo thật trên Chrome: sau reload nút ở trạng thái
       "mbtn mbtn-start is-pending disabled=true", bấm không ăn. Hàm này
       dọn sạch dấu vết đó. Gọi ở lúc khởi động và trong backToMenu(). */
    function resetMenuButton() {
      const b = document.getElementById('start');
      if (!b) return;
      b.classList.remove('is-pending');
      b.disabled = false;
      delete b.dataset.started;
      delete b.dataset.loading;
      const lab = b.querySelector('.mbtn-label');
      if (lab) {
        lab.classList.remove('is-pending');
        if (lab.dataset.idle) lab.textContent = lab.dataset.idle;
      }
      const ov = document.querySelector('#boot .boot-pending');
      if (ov) ov.classList.remove('is-on');
    }

    function backToMenu() {
      try { devClearScreens(); } catch (e) { /* luôn còn đường dưới */ }
      /* Dọn mọi lớp phủ có thể còn lại. .intermission-root không nằm
         trong DEV_SCREENS nên devClearScreens() bỏ sót nó, và một lớp
         phủ z-index 86 còn lại thì menu hiện ra mà bấm không được:
         người chơi về tới màn đầu nhưng nút Bắt đầu nằm dưới tấm phủ. */
      document.querySelectorAll(
        '.ending-root, .te-root, .te-sum, .flight-summary-fallback,'
        + ' .intermission-root, .p2-host, .base-host, .rescue-host,'
        + ' .comms-host, .story-root, .story-screen, .prologue-root,'
        + ' .intro-overlay, .beacon-root'
      ).forEach((n) => n.remove());
      if (boot) boot.style.display = '';
      resetMenuButton();
      baseStarted = false;
      try { window.dispatchEvent(new CustomEvent('smdg:back-to-boot')); } catch (e) { /* không cần */ }
    }

    function restartMission() {
      /* Xoá bản lưu rồi tải lại trang: cách duy nhất chắc chắn không
         còn trạng thái cũ trong bộ nhớ. */
      const reload = () => { try { window.location.reload(); } catch (e) { backToMenu(); } };
      import(BASE + 'save-game.js')
        .then((sg) => { try { sg.clearSave(); } catch (e) { /* không xoá được thì vẫn tải lại */ } })
        .catch(() => { /* thiếu module thì vẫn tải lại */ })
        .then(reload, reload);
    }

    /* ---------- bảng tổng kết dự phòng ----------
       Chỉ dùng khi cả true-ending.js lẫn endings.js đều không nạp
       được. Dựng bằng DOM trần, không phụ thuộc CSS nào, để một file
       thiếu trên bản deploy không biến màn kết thúc thành màn trắng. */
    function showFallbackSummary(success, result, flat, extra, leftPct) {
      document.querySelectorAll('.flight-summary-fallback').forEach((n) => n.remove());
      const en = getLang() === 'en';
      const L = (vi, txtEn) => (en ? txtEn : vi);

      const root = document.createElement('div');
      root.className = 'flight-summary-fallback';
      root.setAttribute('role', 'dialog');
      root.setAttribute('aria-modal', 'true');
      root.setAttribute('aria-label', L('Tổng kết sứ mệnh', 'Mission summary'));
      root.style.cssText = 'position:fixed;inset:0;z-index:120;display:flex;align-items:center;'
        + 'justify-content:center;padding:24px;background:rgba(6,8,12,.9);'
        + 'color:#e9eef6;font:400 15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;';

      const panel = document.createElement('div');
      panel.style.cssText = 'max-width:640px;width:100%;max-height:88vh;overflow:auto;'
        + 'background:#0e131b;border:1px solid #22303f;border-radius:16px;padding:26px 26px 20px;'
        + 'box-shadow:0 24px 70px rgba(0,0,0,.6);';
      root.appendChild(panel);

      const h = document.createElement('h2');
      h.textContent = success
        ? L('SỨ MỆNH HOÀN TẤT', 'MISSION COMPLETE')
        : L('SỨ MỆNH THẤT BẠI', 'MISSION FAILED');
      h.style.cssText = 'margin:0 0 6px;font-size:22px;letter-spacing:.04em;color:'
        + (success ? '#7fe0a3' : '#ff8f8f') + ';';
      panel.appendChild(h);

      const lede = document.createElement('p');
      lede.textContent = success
        ? L('Tàu đã vào quỹ đạo Sao Hỏa và cả ba vai trò còn ký chung một nhật ký.',
          'The ship reached Mars orbit and all three roles still signed the same log.')
        : L('Chuyến bay không hoàn tất. Dưới đây là số liệu thật của lần chạy này.',
          'The flight did not complete. The real numbers from this run are below.');
      lede.style.cssText = 'margin:0 0 18px;color:#9fb0c3;';
      panel.appendChild(lede);

      const neg = (result && result.negotiationState) || null;
      const rows = [];
      /* Số thập phân phải theo ngôn ngữ: bản tiếng Việt dùng dấu phẩy,
         bản tiếng Anh dùng dấu chấm, đúng như phần còn lại của game.
         In cứng dấu chấm thì bảng dự phòng lệch hẳn nhịp với màn thật. */
      const dec = (n, digits) => {
        const fixed = Number(n).toFixed(digits);
        return en ? fixed : fixed.replace('.', ',');
      };
      const days = numOrNull(result && result.elapsedDays);
      if (days !== null) rows.push([L('Thời gian bay', 'Flight time'), dec(days, 1) + ' ' + L('ngày', 'days')]);
      if (numOrNull(flat.day) !== null) rows.push([L('Sol đã sống', 'Sols survived'), String(Math.round(Number(flat.day)))]);
      if (neg && numOrNull(neg.cohesion) !== null) rows.push([L('Đồng thuận cuối', 'Final cohesion'), Math.round(Number(neg.cohesion)) + '%']);
      if (neg && numOrNull(neg.turn) !== null) rows.push([L('Số quyết định', 'Decisions taken'), String(Math.round(Number(neg.turn)))]);
      const gaugeRows = [
        ['oxygen', L('Oxy', 'Oxygen')],
        ['water', L('Nước', 'Water')],
        ['calories', L('Calo', 'Calories')],
        ['power', L('Điện', 'Power')],
      ];
      for (const [k, label] of gaugeRows) {
        if (numOrNull(flat[k]) !== null) rows.push([label, Math.round(Number(flat[k])) + '%']);
      }
      if (numOrNull(extra.massKg) !== null) rows.push([L('Khối lượng tàu', 'Ship mass'), Math.round(extra.massKg) + ' kg']);
      if (numOrNull(extra.costMusd) !== null) rows.push([L('Chi phí', 'Cost'), Math.round(extra.costMusd) + ' M$']);
      if (numOrNull(extra.deltaVMs) !== null) rows.push(['Delta-v', Math.round(extra.deltaVMs) + ' m/s']);

      const dl = document.createElement('dl');
      dl.style.cssText = 'margin:0 0 16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;';
      for (const [k, v] of rows) {
        const dt = document.createElement('dt');
        dt.textContent = k;
        dt.style.cssText = 'color:#8fa3b8;';
        const dd = document.createElement('dd');
        dd.textContent = v;
        dd.style.cssText = 'margin:0;text-align:right;font-variant-numeric:tabular-nums;';
        dl.append(dt, dd);
      }
      if (rows.length) panel.appendChild(dl);

      /* Xếp hạng: dùng đúng luật của true-ending.js — số Sol đã sống
         cộng ngân sách còn dư. Hạng S cần cả hai, nên bảng dự phòng
         tính y hệt thay vì tự đặt luật riêng; hai màn kết thúc cùng
         một ván phải ra cùng một hạng. */
      if (success) {
        const sols = numOrNull(flat.day);
        let rank = 'B';
        if (sols !== null && sols <= 20 && (leftPct === null || leftPct >= 20)) rank = 'S';
        else if (sols !== null && sols <= 30 && (leftPct === null || leftPct >= 10)) rank = 'A';
        const rl = document.createElement('p');
        rl.textContent = L('Xếp hạng sứ mệnh: ', 'Mission rank: ') + rank;
        rl.style.cssText = 'margin:0 0 16px;font-size:17px;color:#ffd479;';
        panel.appendChild(rl);
      } else {
        const why = document.createElement('p');
        why.textContent = (neg && (neg.mutiny || Number(neg.cohesion) <= 0))
          ? L('Vì sao hỏng: đồng thuận trong khoang về 0. Ba vai trò vẫn ngồi cùng một khoang nhưng không còn ra quyết định chung, nên sứ mệnh dừng trước khi tới quỹ đạo Sao Hỏa. Giữ đồng thuận trên 35 phần trăm bằng cách không để một vai trò bị gạt ra ngoài hai lượt liên tiếp.',
            'Why it failed: cabin cohesion hit zero. The three roles still shared a cabin but stopped making joint calls, so the mission stopped short of Mars orbit. Keep cohesion above 35 percent by never leaving one role out of two decisions in a row.')
          : L('Vì sao hỏng: tàu không hoàn tất chặng chuyển tiếp tới quỹ đạo Sao Hỏa trong 258,9 ngày.',
            'Why it failed: the ship did not complete the 258.9 day transfer into Mars orbit.');
        why.style.cssText = 'margin:0 0 16px;padding:12px 14px;border-left:3px solid #ff8f8f;'
          + 'background:#171d26;border-radius:0 8px 8px 0;color:#c9d5e2;';
        panel.appendChild(why);
      }

      const foot = document.createElement('div');
      foot.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;';
      const mkBtn = (label, primary, onClick) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.style.cssText = 'padding:11px 18px;border-radius:10px;cursor:pointer;font:inherit;'
          + (primary
            ? 'background:#2f6fed;border:1px solid #4b86ff;color:#fff;'
            : 'background:#161d27;border:1px solid #2b3a4a;color:#d6e0ea;');
        b.addEventListener('click', onClick);
        return b;
      };
      const again = mkBtn(L('Bay lại', 'Fly again'), false, () => {
        root.remove();
        openFlight(playerName, design);
      });
      foot.appendChild(again);
      foot.appendChild(mkBtn(L('Chơi lại sứ mệnh mới', 'Play a new mission'), false, () => {
        root.remove();
        restartMission();
      }));
      foot.appendChild(mkBtn(L('Về menu chính', 'Back to main menu'), true, () => {
        root.remove();
        backToMenu();
      }));
      panel.appendChild(foot);

      document.body.appendChild(root);
      try { again.focus({ preventScroll: true }); } catch (e) { /* bỏ qua */ }
      return root;
    }

    /* ---------- mở màn kết thúc ---------- */

    async function showFlightEnding(success, result) {
      const flat = flatStats();
      /* true-ending.js cần stats.get(); endings.js đọc thẳng
         stats.day/oxygen/... Một object có cả hai thì phục vụ được cả
         hai module mà không phải rẽ nhánh dữ liệu. */
      const statsFor = Object.assign({}, flat, { get: () => flat });

      /* Số liệu tàu: dùng summary có sẵn nếu xưởng đã tính, còn không
         thì dựng lại từ moduleIds. Bảng dev truyền thiết kế trống nên
         phải có đường này, nếu không báo cáo in "chưa có số" ở khối
         lượng và chi phí. */
      const sum = await summaryOf(design);
      /* numOrNull trả null chứ không phải undefined, nên `??` không bao
         giờ rơi sang vế sau. Phải so sánh tường minh, không thì
         delta-v của xưởng bị bỏ mất và màn kết thúc không hiện nó. */
      const designDv = numOrNull(design && design.deltaV_ms);
      const facts = {
        summary: sum || {},
        deltaV: designDv !== null ? designDv : numOrNull(sum && sum.dvAvailable_ms),
      };
      const extra = flightExtra(result, facts);
      const leftPct = budgetLeftPct(facts.summary);

      let ok = false;
      let info = null;
      try {
        const sg = await import(BASE + 'save-game.js');
        ok = sg.hasSave();
        info = ok ? sg.getSaveInfo() : null;
      } catch (e) {
        ok = false;
        info = null;
      }

      if (success) {
        try {
          const mod = await import(BASE + 'true-ending.js');
          if (mod && typeof mod.openTrueEnding === 'function') {
            const inst = mod.openTrueEnding({
              container: document.body,
              stats: statsFor,
              engine: engineShim(result, facts),
              onRestart: restartMission,
              onExit: backToMenu,
            });
            if (inst && inst.root) return;
          }
          console.warn('[flight] true-ending.js không dựng được màn kết thúc thắng');
        } catch (err) {
          console.warn('[flight] không nạp được màn kết thúc thắng, dùng bảng tổng kết dự phòng', err);
        }
        showFallbackSummary(true, result, flat, extra, leftPct);
        return;
      }

      try {
        const mod = await import(BASE + 'endings.js');
        if (mod && typeof mod.showEnding === 'function') {
          const inst = mod.showEnding({
            id: loseEndingId(result),
            stats: flat,
            extra,
            hasSave: ok,
            saveInfo: info,
            onRetry: () => { openFlight(playerName, design); },
            onLoadSlot: () => { /* màn kết thúc tự mở danh sách mốc lưu */ },
            onRestart: restartMission,
          });
          if (inst && inst.root) return;
          console.warn('[flight] endings.js không có cảnh kết thúc phù hợp:', loseEndingId(result));
        }
      } catch (err) {
        console.warn('[flight] không nạp được endings.js, dùng bảng tổng kết dự phòng', err);
      }
      showFallbackSummary(false, result, flat, extra, leftPct);
    }

    /* ---------- chốt một lần duy nhất ----------
       Ba đường tới đây (onDone của flight.js, bộ canh mutiny, và lệnh
       gỡ từ bên ngoài) đều phải đi qua đúng một cửa, nếu không sẽ có
       hai màn kết thúc chồng nhau. */
    function settle(result) {
      if (settled) return;
      settled = true;
      if (watch) { window.clearInterval(watch); watch = 0; }

      const success = !!(result && result.success);
      const days = numOrNull(result && result.elapsedDays);
      const elapsed = days !== null ? days : ((flight && numOrNull(flight.day)) || 0);

      try {
        localStorage.setItem('smdg.lastFlight', JSON.stringify({ success, days: elapsed }));
      } catch (e) { /* chặn ghi thì bỏ qua, không ảnh hưởng chơi */ }

      /* Tháo màn bay trước khi dựng màn kết thúc: hai lớp phủ cùng lúc
         thì người chơi bấm không được. */
      try {
        if (flight && typeof flight.destroy === 'function') flight.destroy();
      } catch (e) { /* đã gỡ rồi */ }
      host.remove();

      Promise.resolve()
        .then(() => showFlightEnding(success, { ...(result || {}), elapsedDays: elapsed }))
        .catch((err) => {
          console.error('[flight] màn kết thúc lỗi, dùng bảng tổng kết dự phòng', err);
          try {
            const fallback = flightExtra(result, { summary: (design && design.summary) || {}, deltaV: design && design.deltaV_ms });
            showFallbackSummary(success, { ...(result || {}), elapsedDays: elapsed }, flatStats(), fallback);
          } catch (e) {
            /* Cùng đường: không để người chơi kẹt ở màn trắng. */
            backToMenu();
          }
        });
    }

    flight = startFlight({
      container: host,
      design,
      onDone: (result) => settle(result),
    });

    /* flight.js không báo ra ngoài khi đội vỡ, nó chỉ đổi sang thẻ
       "đội tan rã" nội bộ. Canh cờ mutiny để lần thua cũng vào màn kết
       thúc thật, có phân tích và có nút chơi lại. */
    watch = window.setInterval(() => {
      if (settled) { window.clearInterval(watch); watch = 0; return; }
      const st = flight && flight.state;
      if (st && st.mutiny) {
        settle({
          success: false,
          elapsedDays: (flight && flight.day) || 0,
          negotiationState: st,
        });
      }
    }, 400);

    return {
      destroy: () => {
        settled = true;
        if (watch) { window.clearInterval(watch); watch = 0; }
        host.remove();
      },
    };
  }

  /* Sau màn mở đầu: Giai đoạn 1 trước, căn cứ sau. */
  function afterStory(playerName) {
    /* Xong phần kể chuyện thì vào thẳng căn cứ. Bảng viễn thông KHÔNG
       mở ở đây: nó là một trạm nằm trong căn cứ, người chơi phải tự
       bấm vào Bàn liên lạc mới mở. Trước đây chỗ này gọi openStage1
       ngay sau story nên bảng viễn thông bật lên trước cả khi người
       chơi thấy căn cứ, sai hoàn toàn với thiết kế. */
    enterBase(playerName);
  }

  gear.addEventListener('click', () => { playClick(); openSettings(); });

  /* ---------- cầu nối cho bảng test nhà phát triển ----------
     Bảng test (devtool-panel.js) gọi ba hàm này để nhảy màn, bắn sự
     kiện, chạy công cụ. Đặt ở đây vì chỉ chỗ này mới biết đủ các hàm
     chuyển màn. Ba hàm nhận đúng bộ id trong MILESTONES / EVENTS /
     TOOLS của bảng đó; đổi id một bên là phải đổi bên kia. */

  const DEV_SCREENS = [
    '.base-host', '.rescue-host', '.flight-host', '.comms-host',
    '.story-root', '.story-screen', '.prologue-root', '.intro-overlay',
    '.beacon-root', '.p2-host',
  ].join(', ');

  function devClearScreens() {
    /* Dọn mọi lớp đang phủ trước khi nhảy, nếu không hai màn sẽ
       chồng nhau và người chơi bấm không được. */
    document.querySelectorAll(DEV_SCREENS).forEach((el) => el.remove());
    baseStarted = false;
  }

  function devPlayerName() {
    try { return localStorage.getItem('smdg.playerName') || 'Nhan'; } catch (e) { return 'Nhan'; }
  }

  /* Đặt ngày cho màn căn cứ. Nguồn sự thật của giờ/ngày là
     stats.totalMinutes: base.js dựng đồng hồ từ clockFromStats() đọc
     đúng trường đó. Trước đây chỗ này ghi khoá 'smdg.clock', một khoá
     không ai đọc, nên bấm "căn cứ ngày 20" vẫn vào ngày 1. */
  function devSetDay(day) {
    const d = Math.max(1, Math.min(35, Math.round(Number(day) || 1)));
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem('smdg.stats') || 'null'); } catch (e) { raw = null; }
    const box = (raw && typeof raw === 'object') ? raw : { stats: {}, inv: {} };
    box.stats = box.stats || {};
    box.stats.totalMinutes = (d - 1) * 1440 + 8 * 60;
    /* Đặt lại đồng hồ chết: nếu không, hộp đếm giờ cạn nước cũ vẫn
       còn và người chơi chết ngay nhịp tick đầu tiên sau khi nhảy. */
    box.stats.zeroWaterHours = 0;
    box.stats.zeroCaloriesHours = 0;
    box.stats.stamina = Math.max(60, Number(box.stats.stamina) || 0);
    try { localStorage.setItem('smdg.stats', JSON.stringify(box)); } catch (e) { /* chặn ghi */ }
    return d;
  }

  /* Màn Giai đoạn 2: nạp muộn vì phase2/ là gói riêng, nạp sớm sẽ kéo
     theo cả cây phụ thuộc của nó vào màn boot. */
  async function devOpenPhase2(stepId) {
    const host = document.createElement('div');
    host.className = 'p2-host';
    host.style.cssText = 'position:fixed;inset:0;z-index:80;background:#07090d;';
    document.body.appendChild(host);
    /* phase2/ nằm cạnh src/ trong repo, nên đường dẫn tuỳ chỗ phục vụ:
       bản deploy gom cả hai thư mục vào một gốc (/nasa) thì phase2/ ở
       ngay cạnh index.html, tức BASE + 'phase2/' — thử đường này TRƯỚC.
       Bản dev chạy http.server trong src/ mới cần lùi một cấp. Để
       '../phase2/' trước như bản cũ khiến mỗi lần vào màn này trên bản
       live đều thử một URL không tồn tại trước, sinh 404 thừa trong log
       dù game vẫn chạy nhờ lần thử sau. */
    const candidates = [
      BASE + 'phase2/phase2-app.js',
      BASE + '../phase2/phase2-app.js',
      '/phase2/phase2-app.js',
    ];
    for (const url of candidates) {
      try {
        const mod = await import(url);
        const api = await mod.mountPhase2({ container: host });
        window.__phase2Api = api;
        if (stepId && api && typeof api.setStep === 'function') await api.setStep(stepId);
        return api;
      } catch (e) {
        /* thử đường dẫn kế tiếp */
      }
    }
    console.warn('[dev] không nạp được Giai đoạn 2 ở đường dẫn nào');
    host.remove();
    return null;
  }

  /* Màn sửa chữa: nạp muộn repair.js và mở thẳng bảng sửa ba món.
     Bơm vật liệu trước để cả ba nút sửa bấm được ngay, không phải
     đi nhặt băng keo trước. day chỉ để đồng hồ trong stats có ngày
     hợp lệ khi màn sửa tick. */
  async function devOpenRepair(day) {
    const { openRepairBay } = await import(BASE + 'repair.js');
    const { createStats } = await import(BASE + 'hab-stats.js');
    /* Gọi không tham số để createStats tự đọc lại smdg.stats mà
       devSetDay vừa ghi: truyền {} thì nó bỏ qua bước nạp và đồng hồ
       rơi về ngày 1. */
    const stats = createStats();
    stats.addItems([
      { id: 'tape', qty: 6 },
      { id: 'electronics', qty: 6 },
    ]);
    stats.save();
    openRepairBay({ stats, onDone: () => {}, onClose: () => {} });
    console.info('[dev] mở màn sửa chữa, ngày', day);
  }

  window.__devJump = (id, meta) => {
    const m = meta || {};
    devClearScreens();
    boot.style.display = 'none';
    const name = devPlayerName();

    try {
      if (id === 'boot') {
        boot.style.display = '';
        delete btn.dataset.started;
        return;
      }
      if (id === 'video') {
        /* Video mở đầu, rồi để nó tự gọi tiếp màn truyện. Ở màn test
           chỉ cần thấy đoạn phim chạy đúng, không cần đi hết. */
        playIntro().then(() => runOpening(() => {}));
        return;
      }
      if (id === 'comic') {
        runOpening(() => {});
        return;
      }
      if (id === 'story') {
        getStartStory().then((startStory) => {
          startStory({ onFinish: () => {} });
        });
        return;
      }
      if (id === 'base' || /^base-\d+$/.test(id)) {
        /* Mốc "căn cứ ngày n" mang số ngày trong meta.day; mục "căn cứ"
           cũ không còn trong danh sách nhưng vẫn nhận để một bản lưu
           cũ của bảng dev không gãy. */
        const day = devSetDay(m.day);
        try { localStorage.setItem('smdg.stage1Done', '1'); } catch (e) { /* chặn ghi */ }
        enterBase(name);
        console.info('[dev] vào căn cứ ngày', day);
        return;
      }
      if (id === 'repair') {
        /* Màn sửa ba món cần stats thật và cần đủ vật liệu để các nút
           sửa bấm được. Bơm vật liệu + hạt giống rồi mở thẳng
           openRepairBay, đúng hàm mà base.js gọi ở nút "radio". Không
           đi qua màn căn cứ: màn sửa là lớp phủ riêng, đi qua căn cứ
           thì phải chơi tới ngày 6 mới mở được. */
        const day = devSetDay(m.day || 6);
        try { localStorage.setItem('smdg.stage1Done', '1'); } catch (e) { /* chặn ghi */ }
        devOpenRepair(day);
        return;
      }
      if (id === 'comms') {
        openStage1({ onDone: () => enterBase(name), onSkip: () => enterBase(name) });
        return;
      }
      if (id === 'earth') {
        openBeaconScene({ onDone: () => enterBase(name) });
        return;
      }
      if (id === 'p2-1') { devOpenPhase2('cml1'); return; }
      if (id === 'p2-2') { devOpenPhase2('cml3'); return; }
      if (id === 'p2-3') { devOpenPhase2('cml4'); return; }
      if (id === 'p2-4') { devOpenPhase2('execution'); return; }
      if (id === 'summary') { devOpenPhase2('summary'); return; }
      if (id === 'flight') {
        /* Màn bay cần một thiết kế tàu. Dựng sẵn cấu hình "cân bằng"
           của xưởng cứu hộ để màn kết thúc có khối lượng, chi phí và
           delta-v thật mà hiện, không phải "chưa có số". Đi qua
           openFlight() chứ không gọi startFlight() trần: bảng test phải
           chạy đúng đường thật, kể cả màn kết thúc sau khi bay xong.
           Gọi trần thì onDone rỗng, bay xong chỉ thấy màn biến mất, và
           lỗi "không có màn kết thúc" không bao giờ tái hiện được. */
        openFlight(name, {
          name: 'Ares III',
          moduleIds: [
            'prop_nuclear_ntp_900',
            'tank_propellant_main',
            'power_solar_rosa',
            'comms_high_gain',
            'life_eclss_recycler',
            'sensor_edl_suite',
            'shield_radiation',
          ],
          crewCount: 3,
          isp_s: 900,
        });
        return;
      }
    } catch (err) {
      console.warn('[dev] nhay man loi', id, err);
    }
  };

  window.__devEvent = (id, meta) => {
    const name = devPlayerName();
    const m = meta || {};
    try {
      if (id === 'ev:sos') {
        window.dispatchEvent(new CustomEvent('mars:sos-received', {
          detail: { solsRemaining: 300, crewOnMars: 1, signalStrength: 0.8 },
        }));
        devClearScreens();
        boot.style.display = 'none';
        devOpenPhase2('cml1');
        return;
      }
      if (id === 'ev:dsn') {
        window.dispatchEvent(new CustomEvent('earth:dsn-command-sent', {
          detail: { solsToArrival: 64.7, etaDays: 60, progress: 0.75 },
        }));
        if (!document.querySelector('.p2-host')) {
          devClearScreens();
          boot.style.display = 'none';
          devOpenPhase2('execution');
        }
        return;
      }
      if (id === 'ev:beacon') {
        window.dispatchEvent(new CustomEvent('mars:beacon-deployed', {
          detail: { ok: true },
        }));
        if (!document.querySelector('.p2-host')) {
          devClearScreens();
          boot.style.display = 'none';
          devOpenPhase2('execution');
        }
        return;
      }
      if (id === 'ev:signal') {
        /* Chạy ĐÚNG luồng kết Giai đoạn 1: đánh dấu xong, đóng bảng
           viễn thông, mở scene Trái Đất nhận tin rồi vào căn cứ. Đây
           là đường chuyển cảnh thật, không phải một đường tắt riêng. */
        devClearScreens();
        boot.style.display = 'none';
        try { localStorage.setItem('smdg.stage1Done', '1'); } catch (e) { /* chặn ghi */ }
        openBeaconScene({ onDone: () => enterBase(name) });
        return;
      }
      if (id === 'ev:skipvideo') {
        document.querySelectorAll('.intro-overlay').forEach((el) => el.remove());
        return;
      }
      if (id === 'ev:skipcomic') {
        document.querySelectorAll('.prologue-root').forEach((el) => el.remove());
        /* Gỡ lớp tranh xong phải mở màn truyện, nếu không người chơi
           nhìn vào khoảng đen và tưởng game treo. */
        if (!document.querySelector('.story-root') && !document.querySelector('.base-host')) {
          runOpening(() => {});
        }
        return;
      }
    } catch (err) {
      console.warn('[dev] ban su kien loi', id, err);
    }
  };

  window.__devTool = (id, meta) => {
    const m = meta || {};
    try {
      if (id === 'tool:reset') {
        /* Xoá mọi khoá của game, giữ cài đặt, ngôn ngữ và cờ dev để
           không phải nhập lại mật khẩu ngay sau khi đặt lại. */
        const keep = ['smdg.settings', 'smdg.lang', 'smdg.fullscreen', 'smdg.devUnlocked'];
        const keepVals = {};
        keep.forEach((k) => { try { keepVals[k] = localStorage.getItem(k); } catch (e) { /* bỏ */ } });
        const drop = [];
        for (let i = 0; i < localStorage.length; i += 1) drop.push(localStorage.key(i));
        drop.forEach((k) => { if (keep.indexOf(k) === -1) localStorage.removeItem(k); });
        Object.keys(keepVals).forEach((k) => {
          if (keepVals[k] !== null) { try { localStorage.setItem(k, keepVals[k]); } catch (e) { /* bỏ */ } }
        });
        window.location.reload();
        return;
      }
      if (id === 'tool:unlock') {
        try {
          localStorage.setItem('smdg.stage1Done', '1');
          localStorage.setItem('smdg.prologueDone', '1');
        } catch (e) { /* chặn ghi */ }
        /* Mở khoá nông trại: cần hạt, 10 bình nước và 2 băng keo trong
           kho chỉ số, không chỉ một cờ. Thiếu bước này thì bấm xong vẫn
           thấy nông trại có ổ khoá. */
        const bridge = window.__devBase;
        if (bridge && bridge.stats) {
          bridge.stats.addItems([
            { id: 'potato_seed', qty: 3 },
            { id: 'water_bottle', qty: 12 },
            { id: 'tape', qty: 4 },
            { id: 'electronics', qty: 4 },
          ]);
          bridge.stats.save();
        }
        return;
      }
      if (id === 'tool:items') {
        const bridge = window.__devBase;
        if (bridge && bridge.stats) {
          bridge.stats.addItems([
            { id: 'ration', qty: 20 },
            { id: 'water_bottle', qty: 20 },
            { id: 'tape', qty: 20 },
            { id: 'electronics', qty: 20 },
            { id: 'hydrazine', qty: 20 },
            { id: 'media', qty: 20 },
            { id: 'potato', qty: 20 },
            { id: 'potato_seed', qty: 20 },
          ]);
          bridge.stats.save();
        }
        return;
      }
      if (id === 'tool:fill') {
        const bridge = window.__devBase;
        if (bridge && bridge.stats) {
          bridge.stats.devPatch({ water: 100, calories: 100, stamina: 100, sanity: 100 });
          bridge.stats.save();
        }
        return;
      }
      if (id === 'tool:day') {
        const day = devSetDay(m.day);
        /* Thay vì bắt người chơi bấm thêm một lần, nhảy luôn vào căn cứ
           ở ngày đó: đặt ngày mà không vào thì không kiểm được gì. */
        devClearScreens();
        boot.style.display = 'none';
        try { localStorage.setItem('smdg.stage1Done', '1'); } catch (e) { /* chặn ghi */ }
        enterBase(devPlayerName());
        console.info('[dev] đặt ngày', day);
        return;
      }
    } catch (err) {
      console.warn('[dev] cong cu loi', id, err);
    }
  };

  /* ---------- nút Tiếp tục ----------
     Toàn bộ phần bật/tắt và chữ ghi chú của nút này nằm trong
     menu-cinematic.js (initMenu gọi refreshSave). Ở đây chỉ giữ tham
     chiếu để đường dự phòng và bảng dev dùng lại. */
  const btnResume = document.getElementById('resume');
  const saveNote = document.getElementById('save-note');

  /* ---------- hỏi tên sau màn mở đầu ----------
     prologue.js không có ô nhập tên (màn đó không lời thoại), còn màn
     căn cứ và bản lưu đều cần tên phi hành gia. Khối này là bước duy
     nhất còn chữ trước khi vào game. Dùng đúng lớp .name-card của
     css/story.css đã nạp sẵn ở khung khởi động, nên không phải thêm
     kiểu mới và chữ vẫn theo i18n. */
  const NAME_KEY = 'smdg.playerName';

  function savedName() {
    try { return (localStorage.getItem(NAME_KEY) || '').trim(); } catch (e) { return ''; }
  }

  function askName(onReady) {
    const known = savedName();
    if (known) { onReady(known); return null; }

    const wrap = document.createElement('div');
    wrap.className = 'story-screen';
    wrap.innerHTML = `
      <div class="story-sub" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0;">
        <div class="name-card">
          <div class="ask">${t('name.prompt')}</div>
          <label class="field">
            <span class="field-label">${t('name.label')}</span>
            <input class="inp" type="text" maxlength="18" autocomplete="off"
                   spellcheck="false" placeholder="${t('name.placeholder')}" value="">
          </label>
          <button class="go" type="button" disabled>${t('name.sign')}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);

    const inp = wrap.querySelector('.inp');
    const go = wrap.querySelector('.go');

    function commit() {
      const v = inp.value.trim();
      if (!v) return;
      try { localStorage.setItem(NAME_KEY, v); } catch (e) { /* chặn ghi thì vẫn chơi tiếp */ }
      wrap.remove();
      onReady(v);
    }

    inp.addEventListener('input', () => { go.disabled = inp.value.trim().length === 0; });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
    go.addEventListener('click', commit);
    setTimeout(() => { try { inp.focus(); } catch (e) { /* màn cảm ứng không cần focus */ } }, 30);

    return { destroy: () => wrap.remove() };
  }

  /* Chạy màn mở đầu. Ưu tiên prologue; hỏng thì quay về story cũ. */
  async function runOpening(onFinish) {
    const startPrologue = await getStartPrologue();

    if (startPrologue) {
      let settled = false;
      let inst = null;
      const done = () => {
        if (settled) return;
        settled = true;
        persistNameNote();
        askName((name) => { if (!baseStarted) onFinish(name); });
      };
      try {
        inst = startPrologue({ container: document.body, onDone: done });
        /* Không dựng được lớp phủ nghĩa là prologue lỗi ngay từ đầu:
           dọn phần còn lại rồi đi đường story. */
        if (!document.querySelector('.prologue-root')) throw new Error('prologue không dựng được lớp phủ');
        if (!inst || typeof inst.destroy !== 'function') throw new Error('prologue không trả destroy');
        return;
      } catch (e) {
        settled = true;
        /* destroy gỡ cả listener bàn phím và lớp phủ. Gọi destroy trước,
           chỉ khi nó ném lỗi mới gỡ tay phần tử, để không còn một
           listener keydown mồ côi bắt phím trong màn hình sau. */
        try {
          if (inst && typeof inst.destroy === 'function') inst.destroy();
        } catch (_) { /* destroy hỏng thì gỡ tay bên dưới */ }
        try {
          const r = document.querySelector('.prologue-root');
          if (r) r.remove();
        } catch (_) { /* đã gỡ rồi */ }
      }
    }

    /* đường dự phòng: màn kể chuyện 24 lượt, có sẵn ô nhập tên */
    const startStory = await getStartStory();
    startStory({ onFinish: ({ playerName }) => { onFinish(playerName); } });
  }

  /* Ghi chú cờ đã xem màn mở đầu. Chỉ là dấu vết, không dùng để chặn
     hiển thị, nên lỗi ghi không ảnh hưởng luồng. */
  function persistNameNote() {
    try { localStorage.setItem('smdg.prologueDone', '1'); } catch (e) { /* bỏ qua */ }
  }

  /* ---------- phản hồi tức thì khi bấm Bắt đầu / Tiếp tục ----------
     Ba yêu cầu đặt ra cho phần này:
       1. Trong 100ms phải thấy phản hồi: chữ đổi thành "Đang tải..."
          kèm vòng xoay, nút bị khoá.
       2. Sau 4 giây chưa xong thì hiện dòng "Đang tải tài nguyên...".
       3. Sau 15 giây thì hiện thông báo và nút thử lại.
     Toàn bộ phần đó nằm trong menu-cinematic.js (hàm initMenu), cùng
     hoạt cảnh phóng tàu và cờ khoá chống bấm hai lần. Ở đây chỉ nối
     đúng hàm chuyển màn vào.

     Vì sao không giữ bản cũ: bản cũ tự dựng một lớp phủ riêng và ghi
     đè innerHTML của nút, nên xoá mất khung chữ và vòng xoay mà
     menu.css định kiểu. Một chỗ duy nhất đổi trạng thái nút thì mới
     trả về nguyên trạng được khi lỗi. */

  /* chạy trước màn chờ, song song với hoạt cảnh phóng: nếu người chơi
     bấm khi mạng còn chậm, 2,6 giây hoạt cảnh là thời gian tải luôn,
     không phải chờ thêm lần nữa */
  function preloadAhead() {
    const p = runPreloader();
    /* nuốt lỗi: màn chờ hỏng thì vẫn vào game, chỉ mất bước tải trước */
    return p.catch((e) => {
      console.warn('[boot] màn chờ lỗi, vào thẳng game', e);
      return { ok: false, failed: [] };
    });
  }

  /* Vào game từ nút Bắt đầu. Chạy sau khi hoạt cảnh phóng kết thúc. */
  async function enterFromStart() {
    /* Cổng chặn CHỈ bọc bước tải tài nguyên, không bọc đoạn phim.
       Trước đây bọc cả hàm nên lớp phủ xoay tròn nằm đè lên video mở
       đầu suốt mấy chục giây, che mất cả cảnh phim. Giờ: hiện cổng,
       tải xong thì GỠ NGAY, rồi mới phát phim trên nền sạch. */
    await gate(async () => {
      const pre = preloadAhead();
      await pre;
    }, { minMs: 300, maxMs: 8000 });

    boot.style.display = 'none';

    /* Video mở đầu tự nuốt lỗi bên trong, nhưng bọc thêm một lớp:
       một lỗi bất ngờ ở đây không được chặn phần truyện. */
    try {
      await playIntro();
    } catch (e) {
      console.error('[boot] đoạn phim mở đầu lỗi, bỏ qua', e);
      document.querySelectorAll('.intro-overlay').forEach((n) => n.remove());
    }

    await runOpening((playerName) => {
      if (baseStarted) return;
      afterStory(playerName);
    });
  }

  /* Vào game từ nút Tiếp tục, dùng đúng hàm khôi phục của save-game. */
  function enterFromResume() {
    const r = resumeFromSave();
    if (!r || !r.ok) {
      /* Bản lưu hỏng giữa chừng thì đừng treo màn hình, nói rõ rồi
         trả nút về trạng thái bấm được. */
      throw new Error('bản lưu không đọc được');
    }
    boot.style.display = 'none';
    /* phase 'comms' nghĩa là bản lưu được tạo lúc chưa qua Giai đoạn 1,
       nên phải vào lại đúng chỗ đó thay vì nhảy thẳng vào căn cứ. */
    if (r.phase === 'comms') afterStory(r.playerName || '');
    else enterBase(r.playerName || '');
  }

  /* Phản hồi tức thì khi bấm Bắt đầu: lớp mờ tối phủ màn menu, câu
     "Đang chuẩn bị..." trên nút. Tách sang boot-feedback.js để không
     giành quyền điều khiển nút với menu-cinematic.js. Nạp mềm: thiếu
     file thì chỉ mất lớp phủ, luồng vào game không đổi. */
  try {
    const fb = await import(BASE + 'boot-feedback.js');
    if (fb && typeof fb.installBootFeedback === 'function') fb.installBootFeedback();
  } catch (e) {
    console.warn('[boot] chưa nạp được phản hồi nút Bắt đầu', e);
  }

  /* Gắn toàn bộ phần tương tác của menu. Nạp mềm: thiếu file thì nút
     Bắt đầu vẫn phải chạy, chỉ mất hoạt cảnh. */
  let menuApi = null;
  try {
    const menu = await import(BASE + 'menu-cinematic.js');
    menuApi = menu.initMenu({
      onStart: enterFromStart,
      onResume: enterFromResume,
      onSettings: openSettings,
      playClick,
      hasSave,
      getSaveInfo,
    });
  } catch (e) {
    console.warn('[menu] chưa nạp được màn menu mới, dùng đường dự phòng', e);
  }

  /* Đường dự phòng khi menu-cinematic.js không nạp được: nút vẫn phải
     bấm ra game, chỉ là không có hoạt cảnh. */
  if (!menuApi) {
    btn.addEventListener('click', async () => {
      if (btn.dataset.started === '1') return;
      btn.dataset.started = '1';
      btn.disabled = true;
      playClick();
      const lab = btn.querySelector('.mbtn-label');
      /* Nhãn này hiện trên nút trong lúc game đang vào màn mở đầu. Không
         có khoá i18n riêng cho nó, nên chọn chuỗi theo ngôn ngữ đang bật
         ngay tại đây. Viết cứng tiếng Việt thì người chơi đã chọn EN vẫn
         thấy "Đang tải..." ngay ở nút họ vừa bấm. */
      if (lab) lab.textContent = getLang() === 'en' ? 'Loading...' : 'Đang tải...';
      try {
        await enterFromStart();
      } catch (err) {
        console.error('[boot] màn mở đầu lỗi, vào thẳng phần chơi', err);
        btn.dataset.started = '';
        btn.disabled = false;
        if (baseStarted) return;
        document.querySelectorAll('.prologue-root, .intro-overlay, .story-root, .story-screen')
          .forEach((n) => n.remove());
        boot.style.display = 'none';
        afterStory(savedName());
      }
    });
  }

  /* Khi màn kết thúc hoặc bảng dev đưa người chơi về màn đầu, phải dọn
     dấu vết của lần phóng trước, nếu không lần sau vào sẽ thấy cảnh
     vẫn đang rung và tàu đã bay mất. */
  function backToMenuReset() {
    if (menuApi && typeof menuApi.reset === 'function') menuApi.reset();
    if (menuApi && typeof menuApi.refreshSave === 'function') menuApi.refreshSave();
    document.querySelectorAll('.menu-fade.is-on').forEach((n) => n.classList.remove('is-on'));
  }
  window.addEventListener('smdg:back-to-boot', backToMenuReset);

  /* ---------- chơi lại Giai đoạn 1 từ màn căn cứ ----------
     base.js phát sự kiện này khi bấm thẻ "Chơi lại màn liên lạc".
     Dùng sự kiện thay vì import thẳng comms.js vào base.js để hai
     màn không phụ thuộc vòng vào nhau. Lớp phủ của comms nằm trên
     màn căn cứ (z-index 90), nhưng vẫn ẩn màn căn cứ đi để trình đọc
     màn hình không đọc lẫn hai lớp nội dung. */
  window.addEventListener('smdg:comms-replay', () => {
    if (!baseStarted) return;
    if (document.querySelector('.comms-host')) return;

    const baseHost = document.querySelector('.base-host');
    if (baseHost) baseHost.style.visibility = 'hidden';
    const restore = () => { if (baseHost) baseHost.style.visibility = ''; };

    openStage1({ onDone: restore, onSkip: restore });
  });

  bindClickSounds();

  /* đổi ngôn ngữ thì cập nhật cả khung khởi động và nút bỏ qua */
  onLangChange(() => {
    applyToDom();
    const sk = document.querySelector('.comms-skip');
    if (sk) sk.textContent = t('comms.skip');
  });
</script>
</body>
</html>
