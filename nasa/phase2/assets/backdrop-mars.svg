<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Martian horizon with dust haze and orbiting relay satellite">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a08"/>
      <stop offset="0.32" stop-color="#22120a"/>
      <stop offset="0.58" stop-color="#4a2310"/>
      <stop offset="0.78" stop-color="#8a441c"/>
      <stop offset="1" stop-color="#2f1709"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.06" r="0.62">
      <stop offset="0" stop-color="#f0c48a" stop-opacity="0.55"/>
      <stop offset="0.34" stop-color="#c47a3a" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#7a3e1a" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d2e14"/>
      <stop offset="1" stop-color="#301809"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33190b"/>
      <stop offset="1" stop-color="#120a05"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#e08a3c" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.42" stop-color="#07090d" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#07090d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#07090d" stop-opacity="0.88"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- dải sao mờ, chỉ ở nửa trên bầu trời -->
  <g fill="#eaf1f8">
    <circle cx="120" cy="60" r="1.7" opacity=".55"/>
    <circle cx="260" cy="112" r="1.2" opacity=".40"/>
    <circle cx="392" cy="46" r="1.4" opacity=".50"/>
    <circle cx="520" cy="140" r="1.1" opacity=".32"/>
    <circle cx="648" cy="72" r="1.6" opacity=".44"/>
    <circle cx="806" cy="120" r="1.2" opacity=".36"/>
    <circle cx="932" cy="52" r="1.5" opacity=".48"/>
    <circle cx="1084" cy="132" r="1.1" opacity=".28"/>
    <circle cx="1216" cy="68" r="1.4" opacity=".42"/>
    <circle cx="1364" cy="118" r="1.2" opacity=".34"/>
    <circle cx="1488" cy="58" r="1.6" opacity=".46"/>
    <circle cx="70" cy="196" r="1.1" opacity=".26"/>
    <circle cx="332" cy="216" r="1.2" opacity=".24"/>
    <circle cx="712" cy="204" r="1.1" opacity=".22"/>
    <circle cx="1050" cy="228" r="1.2" opacity=".20"/>
    <circle cx="1430" cy="196" r="1.1" opacity=".24"/>
  </g>

  <!-- dải bụi mỏng giữa trời -->
  <rect y="470" width="1600" height="150" fill="url(#haze)"/>

  <!-- vệ tinh chuyển tiếp trên quỹ đạo, thân và hai tấm pin -->
  <g stroke="#4fb8c9" stroke-width="2" fill="none" opacity=".62">
    <rect x="1150" y="196" width="26" height="26" rx="3"/>
    <path d="M1150 209h-46"/>
    <path d="M1176 209h46"/>
    <rect x="1058" y="199" width="40" height="20" rx="2"/>
    <rect x="1182" y="199" width="40" height="20" rx="2"/>
    <path d="M1163 196v-14"/>
  </g>

  <!-- hai lớp núi đồi chân trời -->
  <path d="M0 640 L96 600 L168 626 L268 566 L352 612 L448 574 L536 622 L640 584
           L742 628 L836 592 L944 634 L1044 596 L1148 632 L1252 590 L1360 630
           L1464 598 L1600 636 L1600 900 L0 900 Z"
        fill="url(#ridgeFar)" opacity=".9"/>

  <path d="M0 720 L120 686 L214 716 L318 664 L430 708 L548 672 L660 714 L784 676
           L902 718 L1018 682 L1136 720 L1258 686 L1372 722 L1494 688 L1600 718
           L1600 900 L0 900 Z"
        fill="url(#ridgeNear)"/>

  <!-- đồng bằng phía trước, phẳng và tối -->
  <path d="M0 812 L200 796 L420 814 L640 798 L860 816 L1080 800 L1300 818 L1600 802
           L1600 900 L0 900 Z" fill="#160d06"/>

  <!-- vệt đá rải rác trên đồng bằng -->
  <g stroke="#2a1809" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M240 842h34"/>
    <path d="M520 856h26"/>
    <path d="M820 838h40"/>
    <path d="M1120 858h30"/>
    <path d="M1380 844h22"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
